<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home Wireframe Editor</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#1f3347;--mut:#6b7684;--line:#c9d1da;--acc:#0e5a73;--sel:#4338ca}
@media (prefers-color-scheme:dark){:root{--bg:#14181d;--panel:#1d232a;--ink:#e6ebf0;--mut:#93a0ad;--line:#38414b;--acc:#4fb3d1;--sel:#8b84ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px system-ui,sans-serif;display:flex;height:100vh}
#side{width:240px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px;overflow:auto}
#side h2{font-size:14px;margin:0 0 8px}#side h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:14px 0 6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.row label{display:flex;flex-direction:column;font-size:11px;color:var(--mut)}
input[type=number]{width:100%;padding:4px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
button{padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit}button:hover{border-color:var(--acc)}
.btns{display:flex;flex-wrap:wrap;gap:6px}.name{font-weight:600;margin-bottom:6px}.hint{color:var(--mut);font-size:12px;line-height:1.5}
#wrap{flex:1;overflow:auto;padding:20px}
#canvas{position:relative;width:1200px;height:1000px;background:var(--panel);border:1px solid var(--line);margin:0 auto;
 background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px;background-blend-mode:normal}
#canvas.nogrid{background-image:none}
.el{position:absolute;border:1.5px solid var(--acc);background:color-mix(in srgb,var(--acc) 9%,var(--panel));border-radius:3px;display:flex;align-items:center;justify-content:center;
 font-size:12px;color:var(--ink);cursor:move;user-select:none;overflow:hidden;text-align:center;padding:2px 6px}
.el.sel{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel);z-index:5;background:color-mix(in srgb,var(--sel) 14%,var(--panel))}
.el.dd::after{content:"▾";position:absolute;right:8px;color:var(--mut)}
.el.ghost{border-style:dashed;background:transparent}
.h{position:absolute;right:0;bottom:0;width:12px;height:12px;cursor:nwse-resize;background:var(--sel);opacity:0}.el.sel .h{opacity:1}
.tag{position:absolute;left:0;top:0;font-size:10px;background:var(--sel);color:#fff;padding:0 4px;display:none}.el.sel .tag{display:block}
</style></head><body>
<div id="side">
 <h2>Home screen wireframe</h2>
 <div class="hint">Drag a box to move it. Drag the corner handle to resize. Arrow keys nudge (Shift = 10px).</div>
 <h3>Selected</h3>
 <div id="none" class="hint">Nothing selected.</div>
 <div id="form" hidden>
  <div class="name" id="nm"></div>
  <div class="row"><label>X<input type="number" id="fx"></label><label>Y<input type="number" id="fy"></label>
  <label>Width<input type="number" id="fw"></label><label>Height<input type="number" id="fh"></label></div>
  <div class="btns" style="margin-top:8px"><button id="dup">Duplicate</button><button id="del">Delete</button></div>
 </div>
 <h3>Canvas</h3>
 <div class="btns"><button id="grid">Grid: on</button><button id="snap">Snap: 10px</button><button id="add">+ Add box</button></div>
 <h3>Layout</h3>
 <div class="btns"><button id="copy">Copy layout JSON</button><button id="reset">Reset</button></div>
 <div class="hint" style="margin-top:8px">Auto-saved in this browser. Copy the JSON and paste it to me to apply the layout to the real page.</div>
</div>
<div id="wrap"><div id="canvas"></div></div>
<script>
var KEY="rfq-home-wireframe-v1";
var DEF=[
 ["Logo  Bid.Finder",40,16,160,36],["Edit my profile",900,16,140,36,"btn"],["Refresh",1060,16,100,36,"btn"],
 ["Title: View Open Bids & RFQs",40,80,520,44],["Stats line (N bids from M sources)",40,128,520,24,"ghost"],
 ["Search by keyword or bid title  🔍",780,84,380,40],
 ["Category",40,180,170,40,"dd"],["Location",220,180,170,40,"dd"],["Deadline",400,180,170,40,"dd"],["Posted",580,180,170,40,"dd"],
 ["Bid value",40,230,170,40,"dd"],["Who can bid",220,230,170,40,"dd"],["Registration",400,230,170,40,"dd"],
 ["Filtered by: chips  ✕   |  Clear All",40,290,1120,32,"ghost"],
 ["N results",40,340,200,30,"ghost"],["Order By ▾",960,340,200,30,"dd"],
 ["Result row 1 — map icon · title · state · category · Published / Closing",40,384,1120,90],
 ["Result row 2",40,484,1120,90],["Result row 3",40,584,1120,90],["Result row 4",40,684,1120,90],
 ["Show more (N left)",460,800,280,40,"btn"]
];
var els=[],selId=null,grid=true,snap=10,cv=document.getElementById("canvas");
function mk(a,i){return{id:i,t:a[0],x:a[1],y:a[2],w:a[3],h:a[4],k:a[5]||""}}
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return DEF.map(mk)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(els))}catch(e){}}
els=load();
function sn(v){return snap?Math.round(v/snap)*snap:Math.round(v)}
function render(){
 cv.innerHTML="";
 els.forEach(function(e){
  var d=document.createElement("div");d.className="el "+e.k+(e.id===selId?" sel":"");d.dataset.id=e.id;
  d.style.cssText="left:"+e.x+"px;top:"+e.y+"px;width:"+e.w+"px;height:"+e.h+"px";
  d.innerHTML='<span class="tag">'+e.w+'×'+e.h+' @ '+e.x+','+e.y+'</span>'+esc(e.t)+'<span class="h"></span>';
  d.addEventListener("pointerdown",function(ev){down(ev,e,ev.target.classList.contains("h"))});
  d.addEventListener("dblclick",function(){var n=prompt("Label",e.t);if(n!=null){e.t=n;save();render()}});
  cv.appendChild(d)});
 form();
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function cur(){return els.filter(function(e){return e.id===selId})[0]}
function form(){var e=cur();document.getElementById("none").hidden=!!e;document.getElementById("form").hidden=!e;
 if(!e)return;document.getElementById("nm").textContent=e.t;["x","y","w","h"].forEach(function(k){document.getElementById("f"+k).value=e[k]})}
function down(ev,e,resize){
 ev.preventDefault();ev.stopPropagation();selId=e.id;
 var sx=ev.clientX,sy=ev.clientY,o={x:e.x,y:e.y,w:e.w,h:e.h};
 // select without full re-render so drag continues smoothly
 [].forEach.call(cv.children,function(c){c.classList.toggle("sel",+c.dataset.id===e.id)});form();
 var node=cv.querySelector('[data-id="'+e.id+'"]');
 function mv(m){var dx=m.clientX-sx,dy=m.clientY-sy;
  if(resize){e.w=Math.max(20,sn(o.w+dx));e.h=Math.max(16,sn(o.h+dy))}
  else{e.x=Math.max(0,sn(o.x+dx));e.y=Math.max(0,sn(o.y+dy))}
  node.style.left=e.x+"px";node.style.top=e.y+"px";node.style.width=e.w+"px";node.style.height=e.h+"px";
  node.querySelector(".tag").textContent=e.w+"×"+e.h+" @ "+e.x+","+e.y;form()}
 function up(){removeEventListener("pointermove",mv);removeEventListener("pointerup",up);save()}
 addEventListener("pointermove",mv);addEventListener("pointerup",up)}
cv.addEventListener("pointerdown",function(){selId=null;render()});
["x","y","w","h"].forEach(function(k){document.getElementById("f"+k).addEventListener("input",function(){
 var e=cur();if(!e)return;e[k]=Math.max(0,+this.value||0);save();var v=this;render();v.focus()})});
addEventListener("keydown",function(ev){var e=cur();if(!e||/INPUT|TEXTAREA/.test(ev.target.tagName))return;
 var s=ev.shiftKey?10:1,m={ArrowLeft:["x",-s],ArrowRight:["x",s],ArrowUp:["y",-s],ArrowDown:["y",s]}[ev.key];
 if(m){ev.preventDefault();e[m[0]]=Math.max(0,e[m[0]]+m[1]);save();render()}
 else if(ev.key==="Delete"||ev.key==="Backspace"){els=els.filter(function(x){return x!==e});selId=null;save();render()}});
document.getElementById("del").onclick=function(){els=els.filter(function(x){return x.id!==selId});selId=null;save();render()};
document.getElementById("dup").onclick=function(){var e=cur();if(!e)return;var n=JSON.parse(JSON.stringify(e));n.id=Date.now();n.x+=20;n.y+=20;els.push(n);selId=n.id;save();render()};
document.getElementById("add").onclick=function(){var n={id:Date.now(),t:"New box",x:60,y:60,w:160,h:40,k:""};els.push(n);selId=n.id;save();render()};
document.getElementById("grid").onclick=function(){grid=!grid;cv.classList.toggle("nogrid",!grid);this.textContent="Grid: "+(grid?"on":"off")};
document.getElementById("snap").onclick=function(){snap=snap===10?(snap=0,0):snap===0?5:10;this.textContent="Snap: "+(snap?snap+"px":"off")};
document.getElementById("reset").onclick=function(){if(confirm("Reset to the starting layout?")){els=DEF.map(mk);selId=null;save();render()}};
document.getElementById("copy").onclick=function(){var j=JSON.stringify(els.map(function(e){return{label:e.t,x:e.x,y:e.y,w:e.w,h:e.h}}),null,1),b=this;
 (navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(function(){b.textContent="Copied!"},function(){prompt("Copy this:",j)});
 setTimeout(function(){b.textContent="Copy layout JSON"},1500)};
render();
</script></body></html>
