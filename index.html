<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFQ Bid Tracker - Discover Group</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1c2430; --muted: #6b7686; --line: #e3e7ed;
    --accent: #1f4e8c; --ok: #1d7a46; --warn: #b26a00; --bad: #b3261e;
    --federal: #1f4e8c; --state: #6a3fa0; --local: #0e7c7b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 16px 24px 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); }
  .sample { background: #fff3cd; color: #7a5b00; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .toolbar { padding: 4px 24px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar input, .toolbar select { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; }
  .toolbar input[type=search] { min-width: 220px; }
  .toolbar label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .wrap { margin: 0 24px 24px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  table { border-collapse: collapse; width: 100%; table-layout: auto; }
  th, td { padding: 8px 8px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); overflow-wrap: break-word; }
  table { table-layout: fixed; }
  th:nth-child(1) { width: 7%; }  th:nth-child(2) { width: 14%; } th:nth-child(3) { width: 9%; }
  th:nth-child(4) { width: 7%; }  th:nth-child(5) { width: 6%; }  th:nth-child(6) { width: 7%; }
  th:nth-child(7) { width: 5%; }  th:nth-child(8) { width: 8%; }  th:nth-child(9) { width: 5%; }
  th:nth-child(10) { width: 13%; } /* Est. value; Details takes the rest */
  th { overflow-wrap: normal; }
  th { position: sticky; top: 0; background: #eef1f5; font-size: 11px; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); cursor: pointer; user-select: none; }
  th.nosort { cursor: default; }
  th .arrow { margin-left: 4px; color: var(--accent); }
  tr:last-child td { border-bottom: 0; }
  tr.closed td { opacity: .5; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .req-title { font-weight: 600; }
  .agency { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; color: #fff; font-size: 12px; font-weight: 600; }
  .badge.Federal { background: var(--federal); } .badge.State { background: var(--state); } .badge.Local { background: var(--local); }
  .chip { display: inline-block; background: #eef1f5; border-radius: 4px; padding: 1px 6px; margin: 0 4px 4px 0; font-size: 12px; }
  .chip.flag { background: #fdecea; color: var(--bad); font-weight: 600; }
  .chip.amend { background: #fff3cd; color: #7a5b00; font-weight: 600; }
  .region { font-weight: 600; margin-bottom: 4px; }
  .days { font-weight: 600; }
  .left { font-size: 12px; margin-top: 2px; }
  .left.urgent { color: var(--bad); font-weight: 600; }
  .left.soon { color: var(--warn); font-weight: 600; }
  .left.ok { color: var(--ok); }
  .left.closed { color: var(--muted); }
  .na { color: var(--muted); }
  a { color: var(--accent); }
  .elig { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .elig.yes { background: #e3f4ea; color: var(--ok); }
  .elig.chip { background: #e8eefc; color: #1f3a8a; margin: 0 4px 4px 0; }
  .elig.unclear { background: #fff3cd; color: #7a5b00; }
  .elig-note { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .val-range { font-size: 12px; color: var(--muted); }
  .val-note { margin-top: 4px; font-size: 11px; line-height: 1.35; color: var(--muted); font-weight: 400; text-align: left; overflow-wrap: anywhere; }
  .val-ex { margin-top: 4px; font-size: 11px; line-height: 1.35; text-align: left; overflow-wrap: anywhere; }
  .val-ex summary { cursor: pointer; color: var(--muted); }
  .val-ex ul { margin: 4px 0 0; padding-left: 14px; }
  .elig { white-space: normal; }
  .facts { margin: 2px 0 6px; padding: 6px 8px; border-left: 3px solid var(--warn); background: #fffaf0; border-radius: 0 4px 4px 0; }
  .facts-h { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 3px; }
  .fact { display: inline-block; margin: 0 4px 4px 0; padding: 1px 7px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: help; }
  .fact.hard { background: #fdecea; color: var(--bad); }
  .fact.cost { background: #fff3cd; color: #7a5b00; }
  .fact.info { background: #e8eef7; color: var(--accent); }
  .scope { color: var(--ink); font-size: 13px; margin-top: 4px; }
  .toggle { margin-top: 6px; padding: 0; border: 0; background: none; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; }
  tr.shall-row td { background: #f8fafc; padding: 10px 12px 14px 36px; }
  tr.shall-row h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  tr.shall-row ul { margin: 0; padding-left: 18px; }
  tr.shall-row li { margin-bottom: 4px; max-width: 900px; }
  tr.shall-row .ref { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  /* Fetch-failure banner: unmissable on purpose; hidden when every state fetched fine. */
  .failbar { margin: 0 24px 12px; padding: 10px 14px; background: #fdecea; color: var(--bad); border: 2px solid var(--bad); border-radius: 8px; }
  .failbar.warn { background: #fff3cd; color: #7a5b00; border-color: var(--warn); }
  .failbar b { font-size: 15px; }
  .failbar ul { margin: 6px 0 0; padding-left: 20px; color: var(--ink); }
  .failbar li { margin-bottom: 2px; }
  @media (max-width: 900px) { .failbar { margin: 0 12px 12px; } }
  /* Narrow screens: each request becomes a card with its cells stacked vertically, labelled. */
  @media (max-width: 900px) {
    .wrap { margin: 0 12px 16px; overflow: visible; background: none; border: 0; }
    table, tbody { display: block; }
    thead { display: none; }
    tbody tr { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    tbody tr.shall-row { margin-top: -8px; }
    tbody td { display: grid; grid-template-columns: 110px 1fr; gap: 8px; width: auto; text-align: left; }
    tbody td.num { text-align: left; }
    tbody td::before { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .02em; padding-top: 2px; }
    tbody tr:not(.shall-row) td:nth-child(1)::before { content: "Request"; }
    tbody tr:not(.shall-row) td:nth-child(2)::before { content: "Category"; }
    tbody tr:not(.shall-row) td:nth-child(3)::before { content: "Eligibility"; }
    tbody tr:not(.shall-row) td:nth-child(4)::before { content: "Posted"; }
    tbody tr:not(.shall-row) td:nth-child(5)::before { content: "End date"; }
    tbody tr:not(.shall-row) td:nth-child(6)::before { content: "Days left"; }
    tbody tr:not(.shall-row) td:nth-child(7)::before { content: "Municipality"; }
    tbody tr:not(.shall-row) td:nth-child(8)::before { content: "RFQ doc"; }
    tbody tr:not(.shall-row) td:nth-child(9)::before { content: "Est. value"; }
    tbody tr:not(.shall-row) td:nth-child(10)::before { content: "Details"; }
    tbody tr:not(.shall-row) td:last-child { border-bottom: 0; }
    tr.shall-row td { display: block; padding-left: 12px; }
  }
  .refreshbar { margin: 0 24px 8px; padding: 8px 12px; border-radius: 6px; background: #e8f0fb; color: var(--accent); border: 1px solid #c5d6ee; }
  .refreshbar.warn { background: #fff4e0; color: var(--warn); border-color: #f0d9a8; }
  .refreshbar ul { margin: 4px 0 0; padding-left: 20px; }
  .refreshbar.offline { background: #fdecea; color: var(--bad); border-color: #f3c4c0; }
</style>
</head>
<body>
<header>
  <h1>RFQ Bid Tracker</h1>
  <span class="sub">Discover Group &middot; Brooklyn, NY</span>
</header>

<div class="refreshbar" id="refreshBar" role="status" hidden></div>

<div class="failbar" id="failBanner" role="alert" hidden></div>

<div class="toolbar">
  <input type="search" id="q" placeholder="Search: filter by specification">
  <select id="st"><option value="">All states</option></select>
  <select id="level">
    <option value="">All levels</option>
    <option>Federal</option><option>State</option><option>Local</option>
  </select>
  <select id="category"><option value="">All categories</option></select>
  <label title="Placeholder deadlines (more than 3 years out) and notices posted over a year ago"><input type="checkbox" id="hideFlagged" checked> Hide flagged</label>
  <span class="sub" id="count"></span>
</div>

<div class="wrap">
  <table>
    <thead>
      <tr id="head"></tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No requests match your filters.</div>
</div>

<script src="data.js"></script>
<script src="sample-data.js"></script>
<script src="facts.js"></script>
<script src="live-sam.js" onerror="void 0"></script>
<script src="live-nyc.js" onerror="void 0"></script>
<script src="live-states.js" onerror="void 0"></script>
<script>
// Merge whichever live feeds exist. No live feed = no requests (never made-up data).
(function () {
  var src = window.LIVE_SOURCES || [];
  if (!src.length) return;
  window.RFQS = src.reduce(function (a, s) { return a.concat(s.rfqs); }, []);
  window.RFQS_META = { source: src.map(function (s) { return s.meta.source; }).join(" + "),
    fetchedAt: src.map(function (s) { return s.meta.fetchedAt; }).sort()[0] };
})();
</script>
<script>
// Fetch health: read the per-state results that fetch-states.js records in live-states.js (meta.states) and show a banner
// for every state whose last fetch failed (red) or was partial (amber). Failed states keep showing their last notices,
// so without this the rows would look current. Also sets window.STATE_ISSUES for the state dropdown.
(function () {
  var NAMES = { AK: "Alaska", AR: "Arkansas", CO: "Colorado", DE: "Delaware", FL: "Florida", HI: "Hawaii", IA: "Iowa", ID: "Idaho", IN: "Indiana", KS: "Kansas", LA: "Louisiana", MO: "Missouri", MS: "Mississippi", NE: "Nebraska", NY: "New York", OK: "Oklahoma", PA: "Pennsylvania", RI: "Rhode Island", SC: "South Carolina", SD: "South Dakota", TX: "Texas", TXDOT: "Texas (TxDOT)", VT: "Vermont", WV: "West Virginia", WY: "Wyoming" };
  var src = window.LIVE_SOURCES || [], st = null, issues = {}, items = [], failed = 0;
  src.forEach(function (s) { if (s.meta && s.meta.states) st = s.meta.states; });
  var box = document.getElementById("failBanner");
  function when(iso) { return iso ? new Date(iso).toLocaleString("en-US") : null; }
  if (!st) {
    // live-states.js missing or unreadable: no state data at all
    items.push("The state feed file (live-states.js) did not load, so no state notices are shown.");
    failed++;
  } else {
    Object.keys(st).sort().forEach(function (code) {
      var r = st[code] || {}, name = NAMES[code] || code;
      if (r.ok === false) {
        failed++;
        issues[code] = "failed";
        items.push(name + " (" + code + "): FETCH FAILED - " + (r.error || "unknown error") + ". " +
          (r.fetchedAt ? "Showing older notices from the last good fetch on " + when(r.fetchedAt) + (r.count != null ? " (" + r.count + " then)" : "") + "; new notices will be missing." : "No notices have ever been fetched for this state."));
      } else if (r.partial) {
        issues[code] = issues[code] || "partial";
        items.push(name + " (" + code + "): PARTIAL fetch - " + r.partial + ". Some notices may be missing.");
      }
    });
  }
  window.STATE_ISSUES = issues;
  if (!items.length) return;
  var title = document.createElement("b");
  title.textContent = failed ? "⚠ Data problem: " + failed + " state source" + (failed === 1 ? "" : "s") + " failed to update" : "⚠ Some state data is incomplete";
  var ul = document.createElement("ul");
  items.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
  box.appendChild(title); box.appendChild(ul);
  box.classList.toggle("warn", !failed);
  box.hidden = false;
  document.title = "⚠ " + document.title;
})();
</script>
<script>
(function () {
  var COLUMNS = [
    { key: "title",    label: "Request" },
    { key: "category", label: "Category" },
    { key: "eligRank", label: "Eligibility" },
    { key: "posted",   label: "Posted" },
    { key: "dueSort",  label: "End date" },
    { key: "daysLeft", label: "Days left", num: true },
    { key: "level",    label: "Municipality" },
    { key: "rfqUrl",   label: "RFQ doc", nosort: true },
    { key: "valueSort", label: "Est. value", num: true },
    { key: "details",  label: "Details", nosort: true }
  ];

  var DAY = 86400000;
  var t = new Date();
  var todayStr = t.getFullYear() + "-" + (t.getMonth() + 1) + "-" + t.getDate();

  // Parse "YYYY-MM-DD" as a local date (avoids UTC off-by-one).
  function d(s) { var p = s.split("-"); return new Date(+p[0], p[1] - 1, +p[2]); }
  function diffDays(a, b) { return Math.round((d(b) - d(a)) / DAY); }
  function fmtDate(s) { return d(s).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); }
  function money(n) { return n == null ? null : "$" + n.toLocaleString("en-US"); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  // Links only ever open https pages; anything else (javascript:, data:) becomes a dead link.
  function safeUrl(u) { return /^https:\/\//i.test(String(u)) ? String(u) : "#"; }

  // Agencies enter placeholder due dates (2040, 2099, 9999...) for open-ended notices.
  // A due date more than 3 years out is treated as "no real due date".
  var noDueCutoff = new Date(); noDueCutoff.setFullYear(noDueCutoff.getFullYear() + 3);
  var noDueStr = noDueCutoff.toISOString().slice(0, 10);
  function hasNoRealDue(r) { return !r.due || r.due > noDueStr; }

  var rows = window.RFQS.map(function (r) {
    var noDue = hasNoRealDue(r);
    return Object.assign({}, r, {
      st: r.level === "Federal" ? "US" : String(r.id).split("-")[0].replace("TXDOT", "TX"), // state code from the id prefix (US = federal)
      noDue: noDue,
      dueSort: noDue ? null : r.due,
      daysLeft: noDue ? null : diffDays(todayStr, r.due),
      // Eligibility sort: fewest requirements first; "Not read" (null) last
      eligRank: r.requires == null ? null : r.requires.length,
      // one number to sort by: published value, else amount stated in the notice, else the similar-awards median
      valueSort: r.value != null ? r.value : r.valueEst ? (r.valueEst.kind === "stated" ? r.valueEst.amount : r.valueEst.median) : null
    });
  });

  // Default sort: dollar value, descending (unknown values last).
  var sort = { key: "valueSort", dir: -1 };
  // The server sends rows without their long "shall" lists (r.shallCount says how many); a list is fetched when its row is opened.
  function shallN(r) { return r.shallCount != null ? r.shallCount : (r.shall || []).length; }
  var expanded = {}; // request id -> true when its "shall" list is open

  var $ = function (id) { return document.getElementById(id); };

  // State filter options (only ids that look like a state code)
  // Every state by full name, with its notice count; states with no notices yet are listed but greyed out.
  var STATE_NAMES = { AL: "Alabama", AK: "Alaska", AZ: "Arizona", AR: "Arkansas", CA: "California", CO: "Colorado", CT: "Connecticut", DE: "Delaware", DC: "District of Columbia", FL: "Florida", GA: "Georgia", HI: "Hawaii", ID: "Idaho", IL: "Illinois", IN: "Indiana", IA: "Iowa", KS: "Kansas", KY: "Kentucky", LA: "Louisiana", ME: "Maine", MD: "Maryland", MA: "Massachusetts", MI: "Michigan", MN: "Minnesota", MS: "Mississippi", MO: "Missouri", MT: "Montana", NE: "Nebraska", NV: "Nevada", NH: "New Hampshire", NJ: "New Jersey", NM: "New Mexico", NY: "New York", NC: "North Carolina", ND: "North Dakota", OH: "Ohio", OK: "Oklahoma", OR: "Oregon", PA: "Pennsylvania", RI: "Rhode Island", SC: "South Carolina", SD: "South Dakota", TN: "Tennessee", TX: "Texas", UT: "Utah", VT: "Vermont", VA: "Virginia", WA: "Washington", WV: "West Virginia", WI: "Wisconsin", WY: "Wyoming" };
  var stCount = {};
  rows.forEach(function (r) { stCount[r.st] = (stCount[r.st] || 0) + 1; });
  Object.keys(STATE_NAMES).concat(["US", "NYC"]).sort().forEach(function (code) {
    var o = document.createElement("option");
    o.value = code;
    var issue = (window.STATE_ISSUES || {})[code] || (code === "TX" && (window.STATE_ISSUES || {}).TXDOT);
    o.textContent = (issue ? "⚠ " : "") + code + " (" + (stCount[code] || 0) + ")" + (issue === "failed" ? " - fetch failed" : issue ? " - partial" : "");
    if (!stCount[code]) o.style.color = "#999";
    if (issue) o.style.color = issue === "failed" ? "#b3261e" : "#b26a00";
    $("st").appendChild(o);
  });

  // Category filter options
  Array.from(new Set(rows.map(function (r) { return r.category; }))).sort().forEach(function (c) {
    var o = document.createElement("option"); o.textContent = c; $("category").appendChild(o);
  });

  function renderHead() {
    $("head").innerHTML = COLUMNS.map(function (c) {
      var arrow = sort.key === c.key ? '<span class="arrow">' + (sort.dir > 0 ? "&#9650;" : "&#9660;") + "</span>" : "";
      return '<th class="' + (c.num ? "num " : "") + (c.nosort ? "nosort" : "") + '" data-key="' + c.key + '">' + c.label + arrow + "</th>";
    }).join("");
  }

  function leftCell(r) {
    if (r.noDue) return '<td class="num"><span class="left">&mdash;</span></td>';
    if (r.daysLeft < 0) return '<td class="num"><span class="left closed">Closed</span></td>';
    var cls = r.daysLeft <= 7 ? "urgent" : r.daysLeft <= 14 ? "soon" : "ok";
    return '<td class="num"><span class="left ' + cls + '" style="font-size:14px">' + r.daysLeft + "</span></td>";
  }

  // Bid factors: facts that commonly decide bid / no-bid, detected from the scope, "shall"
  // statements and requirement chips. Each shows as a labelled chip (hover for the source text).
  // sev "hard" = a gate (can we even qualify / staff it); "cost" = adds cost or effort; "info" = good to know.
  // Bid factors come precomputed from the server (r.facts); facts.js computes them here when the page is opened without it.
  function keyFacts(r) { return r.facts || (window.computeFacts ? window.computeFacts(r) : []); }
  function factsHtml(r) {
    var f = keyFacts(r);
    if (!f.length) return "";
    return '<div class="facts"><div class="facts-h">Bid factors' + (r.aiRead ? " &middot; AI read, please verify" : (f[0] && f[0].kw ? " &middot; keyword match on title/scope only" : "")) + "</div>" +
      f.map(function (k) {
        return '<span class="fact ' + k.sev + '" title="' + esc(k.why) + '">' + (k.sev === "hard" ? "&#9873; " : "") + esc(k.label) + "</span>";
      }).join("") + "</div>";
  }

  function detailsHtml(r) {
    var x = r.details, h = '<div class="region">' + esc(x.region) + "</div>" + factsHtml(r);
    // Restrictions / set-asides live in the Eligibility column only; show other notes here.
    var inElig = (r.requires || []).map(function (q) { return q.toLowerCase(); });
    if (x.amended) h += '<span class="chip amend">Amended</span>';
    (x.warnings || []).forEach(function (w) { h += '<span class="chip amend">&#9888; ' + esc(w) + "</span>"; });
    x.requirements.forEach(function (q) {
      if (inElig.indexOf(String(q).toLowerCase()) < 0 && !(x.restriction && q === x.restriction)) h += '<span class="chip">' + esc(q) + "</span>";
    });
    return h;
  }

  var SCOPE_MAX = 220;
  var scopeOpen = {}; // request id -> true when full description is shown
  function scopeHtml(r, open) {
    if (!r.scope) return '<div class="scope"><span class="na">' + esc(r.details && r.details.readWhy ? "Not read: " + r.details.readWhy + ". The source data has no description." : "No data") + "</span></div>";
    var long = r.scope.length > SCOPE_MAX;
    var text = long && !open ? r.scope.slice(0, SCOPE_MAX - 3).trim() + "..." : r.scope;
    return '<div class="scope">' + esc(text) + "</div>" +
      (r.aiRead ? '<div class="elig-note">AI read, please verify.</div>' : "") +
      (long ? '<button class="toggle scope-toggle" data-id="' + esc(r.id) + '" aria-expanded="' + open + '">' + (open ? "Show less" : "Show more") + "</button> " : "");
  }

  function eligCell(r) {
    var ai = r.aiRead ? '<div class="elig-note">AI read, please verify.</div>' : "";
    if (r.requires == null) {
      // Page was read but never says who may bid (e.g. Delaware's pages hold only title, dates and a contact)
      if (r.aiRead) return '<td><span class="elig unclear">Not stated</span><div class="elig-note">' + esc((r.details && r.details.readNote) || "The notice was read but does not say who may bid. Check the agency's documents or contact.") + "</div>" + ai + "</td>";
      return '<td><span class="elig unclear">Not read</span><div class="elig-note">' + esc((r.details && r.details.readNote) || "Restriction not read from the RFQ; check the document.") + "</div></td>";
    }
    if (!r.requires.length) {
      // Empty list from a notice that was never AI-read means nothing was looked for, not that nothing exists.
      if (!r.aiRead) return '<td><span class="elig unclear">Not read</span><div class="elig-note">' + esc((r.details && r.details.readNote) || "Restriction not read from the RFQ; check the document.") + "</div></td>";
      return '<td><span class="elig yes">No requirements found</span>' + ai + "</td>";
    }
    return "<td>" + r.requires.map(function (q) { return '<span class="elig chip">' + esc(q) + "</span>"; }).join(" ") + ai + "</td>";
  }

  // Est. value cell. Always says where the number came from.
  function compact(n) {
    return n >= 1e6 ? "$" + +(n / 1e6).toFixed(1) + "M" : n >= 1e3 ? "$" + Math.round(n / 1e3) + "K" : "$" + n;
  }
  function valueCell(r) {
    var e = r.valueEst;
    if (r.value != null) return '<td class="num">' + money(r.value) + '<div class="val-note">' + esc(r.valueLabel || "Published by the agency") + "</div></td>";
    if (e && e.kind === "stated") {
      return '<td class="num">' + money(e.amount) + '<div class="val-note">Stated in the notice &middot; AI read, please verify</div>' +
        '<details class="val-ex"><summary>Where from</summary><div>Quoted from the notice: &ldquo;' + esc(e.quote) + "&rdquo;</div></details></td>";
    }
    if (e && e.kind === "similar") {
      var list = e.examples.map(function (a) {
        return '<li><a href="' + esc(safeUrl(a.url)) + '" target="_blank" rel="noopener">' + esc(a.title) + "</a> &middot; " + money(a.amount) +
          (a.vendor ? " &middot; " + esc(a.vendor) : "") + " &middot; " + fmtDate(a.date) + "</li>";
      }).join("");
      if (e.source === "usaspending") {
        return '<td class="num">~' + compact(e.median) + '<div class="val-range">range ' + compact(e.low) + "&ndash;" + compact(e.high) + "</div>" +
          '<div class="val-note">' + (e.basis === "naics" ? "Broad estimate: recent federal awards in this NAICS code, no keyword match" : "Estimate from past federal awards with matching keywords") + "</div>" +
          '<details class="val-ex"><summary>How estimated</summary><div>Not the agency&rsquo;s figure and not read from this notice. ' +
          "Median and 25th&ndash;75th percentile of " + e.n + " contract awards (purchase orders, delivery orders, definitive contracts) in " + esc(e.naics ? "NAICS " + e.naics + " (mapped from this notice’s UNSPSC codes)" : r.category) +
          " from any agency over the last " + e.years + " years, from USAspending.gov. " +
          (e.basis === "naics" ? "Too few award descriptions shared keywords with this title, so this is the typical size of awards in this NAICS code. " : "Matched on title keywords: " + esc(e.keywords.join(", ")) + ". ") +
          "Federal award sizes vary widely; treat as a rough guide. Most recent:</div><ul>" + list + "</ul></details></td>";
      }
      return '<td class="num">~' + compact(e.median) + '<div class="val-range">range ' + compact(e.low) + "&ndash;" + compact(e.high) + "</div>" +
        '<div class="val-note">' + (e.basis === "agency" ? "Broad estimate: this agency&rsquo;s past awards, no keyword match" : "Estimate from past awards with matching keywords") + "</div>" +
        '<details class="val-ex"><summary>How estimated</summary><div>Not the agency&rsquo;s figure and not read from this notice. ' +
        "Median and 25th&ndash;75th percentile of " + e.n + " competitively bid awards " +
        (e.basis === "category+keywords" ? "from any agency" : "to " + esc(r.agency)) + " in the &ldquo;" + esc(r.category) +
        "&rdquo; category over the last " + e.years + " years, from City Record award notices (renewals, amendments and noncompetitive awards excluded). " +
        (e.basis === "agency"
          ? "Too few awards shared keywords with this title, so this is the typical size of the agency&rsquo;s work in this category, not of this kind of work. "
          : "Matched on title keywords: " + esc(e.keywords.join(", ")) + ". ") +
        "Most recent:</div><ul>" + list + "</ul></details></td>";
    }
    // A notice that was never read cannot be said to state no amount: say that it was not looked for.
    if (!r.aiRead) return '<td class="num"><span class="na">Not known</span><div class="val-note">Notice not read, so a stated amount was not looked for; too few similar past awards to estimate</div></td>';
    return '<td class="num"><span class="na">Not published</span><div class="val-note">No stated amount found in the notice; too few similar past awards (federal needs a valid NAICS code) &middot; AI read, please verify</div></td>';
  }

  // Read the filter controls and parse the search text once per render (not once per row).
  function makeFilter() {
    var q = $("q").value.trim().toLowerCase();
    return { st: $("st").value, level: $("level").value, category: $("category").value,
      hideFlagged: $("hideFlagged").checked, pq: q ? parseQuery(q) : null };
  }
  function matches(r, f) {
    if (f.st && r.st !== f.st) return false;
    if (f.level && r.level !== f.level) return false;
    if (f.category && r.category !== f.category) return false;
    if (r.daysLeft < 0) return false; // closed bids are never shown
    if (f.hideFlagged && ((r.details.warnings || []).length || r.noDue)) return false;
    var pq = f.pq;
    if (pq) {
      if (pq.noDue && !r.noDue) return false;
      for (var i = 0; i < pq.nums.length; i++) {
        var n = pq.nums[i], v = n.get ? n.get(r) : r[n.field];
        if (v == null || !n.test(v)) return false;
      }
      if (pq.terms.length) {
        var hay = r._hay || (r._hay = haystack(r));
        for (var j = 0; j < pq.terms.length; j++) if (hay.indexOf(pq.terms[j]) < 0) return false;
      }
    }
    return true;
  }

  // Search: numeric comparisons like "value > 300k", "days left <= 7", "due < 2026-12-31"
  // plus free-text words; every piece must match (AND). Free text searches every field.
  var FIELDS = [
    { field: "valueSort", names: "est\\.? ?value|estimated value|value|price|amount|cost|\\$" },
    { field: "daysLeft",  names: "days? left|days|left" },
    { field: "dueSort",   names: "due(?: date)?|ends?(?: date)?|closes?|deadline", date: true },
    { field: "posted",    names: "posted(?: date)?|date", date: true }
  ];
  // field [:] [operator] value. The operator is optional when a field name is given:
  // "days left: 22", "days left 22", "value 100k-500k" (range).
  var NUM = "\\$?\\s*(\\d[\\d,]*\\.?\\d*)\\s*([kmb])?";
  var NUM_RE = new RegExp("(?<![a-z])(?:(" + FIELDS.map(function (f) { return f.names; }).join("|") + ")\\s*:?\\s*)?(>=|<=|!=|>|<|=)?\\s*(?:(\\d{4}-\\d{2}-\\d{2})|" + NUM + "(?:\\s*-\\s*" + NUM + ")?)(?![a-z0-9-])", "g");
  var MULT = { k: 1e3, m: 1e6, b: 1e9 };
  function parseQuery(q) {
    var nums = [];
    var rest = q.replace(NUM_RE, function (m, name, op, date, num, suf, num2, suf2) {
      if (!name && !op) return m; // bare numbers/dates stay plain search words
      var f = date ? FIELDS[2] : FIELDS[0]; // no field name: dates mean due date, numbers mean value
      if (name) FIELDS.forEach(function (x) { if (new RegExp("^(" + x.names + ")$").test(name.trim())) f = x; });
      if (!!date !== !!f.date) return m; // date/number mismatch: leave as plain text
      function n(x, sf) { return parseFloat(x.replace(/,/g, "")) * (MULT[sf] || 1); }
      var val = date || n(num, suf), test;
      if (!op && num2 != null) { var hi = n(num2, suf2 || suf); test = function (v) { return v >= val && v <= hi; }; }
      else {
        op = op || "=";
        test = function (v) {
          return op === ">" ? v > val : op === "<" ? v < val : op === ">=" ? v >= val : op === "<=" ? v <= val : op === "=" ? v === val : v !== val;
        };
      }
      nums.push({ field: f.field, test: test });
      return " ";
    });
    // "no due date" is a real filter (placeholder/missing deadlines), not three loose words
    var noDue = false;
    rest = rest.replace(/\bno (?:real )?due date\b/g, function () { noDue = true; return " "; });
    // "column: text" limits the text to that column, e.g. "municipality: local", "category: construction"
    var TEXT = {
      "municipality": function (r) { return r.level; }, "level": function (r) { return r.level; },
      "category": function (r) { return r.category; }, "agency": function (r) { return r.agency; },
      "request": function (r) { return r.title; }, "title": function (r) { return r.title; },
      "region": function (r) { return r.details.region; },
      "eligibility": function (r) { return (r.requires || []).join(" "); }
    };
    rest = rest.replace(new RegExp("(?<![a-z])(" + Object.keys(TEXT).join("|") + ")\\s*:\\s*(\"[^\"]*\"|\\S+)", "g"), function (m, name, val) {
      val = val.replace(/"/g, "").toLowerCase();
      nums.push({ get: TEXT[name], test: function (v) { return String(v || "").toLowerCase().indexOf(val) >= 0; } });
      return " ";
    });
    // a column prefix with no text yet ("category:") is still being typed: ignore it rather than match nothing
    rest = rest.replace(new RegExp("(?<![a-z])(?:" + Object.keys(TEXT).join("|") + ")\\s*:\\s*(?=\\s|$)", "g"), " ");
    // "closed" means the end date has passed
    rest = rest.replace(/(?<![a-z])closed(?![a-z])/g, function () {
      nums.push({ get: function (r) { return r.noDue ? null : r.daysLeft; }, test: function (v) { return v < 0; } });
      return " ";
    });
    // "federal", "state", "local" mean the municipality level only, never a word elsewhere in the record
    rest = rest.replace(/(?<![a-z])(federal|state|local)(?![a-z])/g, function (m, w) {
      nums.push({ get: function (r) { return r.level; }, test: function (v) { return String(v || "").toLowerCase() === w; } });
      return " ";
    });
    // a bare column name ("municipality") isn't data, so it doesn't narrow the results
    var labels = COLUMNS.map(function (c) { return c.label.toLowerCase(); }).concat(["municipality", "level", "agency"]);
    var terms = rest.split(/\s+/).filter(Boolean).filter(function (w) { return labels.indexOf(w) < 0; });
    return { nums: nums, noDue: noDue, terms: terms };
  }
  function haystack(r) {
    var parts = [];
    // Free text matches only these fields, never the notice text. Reserved words (federal/state/local,
    // "closed", "no due date", values, days left) are handled in parseQuery against their own field.
    [r.title, r.agency, r.category, r.details && r.details.region].forEach(function (v) { if (v) parts.push(String(v)); });
    (r.requires || []).forEach(function (q) { parts.push(String(q)); });
    ["posted", "due"].forEach(function (k) { if (r[k] && !(k === "due" && r.noDue)) parts.push(fmtDate(r[k])); });
    return parts.join(" ").toLowerCase();
  }

    function render() {
    renderHead();
    var f = makeFilter();
    var list = rows.filter(function (r) { return matches(r, f); });
    var k = sort.key;
    list.sort(function (a, b) {
      var x = a[k], y = b[k];
      // nulls always last
      if (x == null && y == null) return 0;
      if (x == null) return 1;
      if (y == null) return -1;
      if (typeof x === "string") return x.localeCompare(y) * sort.dir;
      return (x - y) * sort.dir;
    });
    var total = list.length;
    var shown = list; // all rows are shown; row DOM is cached so redraws stay fast
    function rowHtml(r) {
      var open = expanded[r.id];
      var shallRow = open ? '<tr class="shall-row' + (r.daysLeft < 0 ? " closed" : "") + '"><td colspan="' + COLUMNS.length + '"><h4>Key requirements ("shall")' + (r.aiRead ? " &middot; AI read, please verify" : "") + '</h4><ul>' +
        (r.shall || []).map(function (s) { return "<li>" + esc(s.text) + (s.ref ? ' <span class="ref">[' + esc(s.ref) + "]</span>" : "") + "</li>"; }).join("") +
        '</ul><a href="' + esc(safeUrl(r.rfqUrl)) + '" target="_blank" rel="noopener">Open the full RFQ document</a></td></tr>' : "";
      return '<tr class="' + (r.daysLeft < 0 ? "closed" : "") + '">' +
        '<td><div class="req-title">' + esc(r.title) + '</div><div class="agency">' + esc(r.agency) + "</div></td>" +
        "<td>" + esc(r.category).replace(/\//g, "/<wbr>") + "</td>" +
        eligCell(r) +
        "<td>" + fmtDate(r.posted) + "</td>" +
        "<td>" + (r.noDue ? (/eMarketplace/.test(r.dueTime || "") ? esc(r.dueTime) : "No real due date") : fmtDate(r.due) + '<div class="agency">' + esc(r.dueTime) + "</div>") + "</td>" +
        leftCell(r) +
        '<td><span class="badge ' + esc(r.level) + '">' + esc(r.level) + "</span></td>" +
        '<td><a href="' + esc(safeUrl(r.rfqUrl)) + '" target="_blank" rel="noopener" title="Source posting">Open RFQ</a>' +
          (r.aiRead ? "" : '<div><span class="elig unclear" title="The documents behind this posting were not read, so the details shown are only what the listing itself gives. Open the posting to see the rest.">No document access</span></div>') + "</td>" +
        valueCell(r) +
        "<td>" + detailsHtml(r) +
          scopeHtml(r, !!scopeOpen[r.id]) +
          (shallN(r) ? '<button class="toggle" data-id="' + esc(r.id) + '" aria-expanded="' + !!open + '">' + (open ? "Hide" : "Show") + " all requirements (" + shallN(r) + ")</button>" : "") +
          "</td></tr>" + shallRow;
    }
    var frag = document.createDocumentFragment();
    shown.forEach(function (r) {
      var sig = (expanded[r.id] ? "1" : "0") + (scopeOpen[r.id] ? "1" : "0");
      if (!r._els || r._els.sig !== sig) { // built once per row (and again only when its Show/Hide state changes)
        var t = document.createElement("tbody");
        t.innerHTML = rowHtml(r);
        r._els = { sig: sig, nodes: Array.prototype.slice.call(t.children) };
      }
      r._els.nodes.forEach(function (n) { frag.appendChild(n); });
    });
    $("body").replaceChildren(frag);
    $("empty").hidden = total > 0;
    $("empty").textContent = rows.length ? "No requests match your filters." : "No data";
    var m = window.RFQS_META;
    $("count").textContent = (total + " of ") + rows.length + " requests · " +
      (m ? "live from " + m.source + ", updated " + new Date(m.fetchedAt).toLocaleString("en-US") : "No data");
  }

  $("body").addEventListener("click", function (e) {
    var b = e.target.closest(".toggle"); if (!b) return;
    var map = b.classList.contains("scope-toggle") ? scopeOpen : expanded;
    var id = b.dataset.id;
    map[id] = !map[id];
    var row = rows.find(function (r) { return r.id === id; });
    if (map === expanded && map[id] && row && !row.shall) { // fetch the long list the first time it is opened
      b.disabled = true; b.textContent = "Loading...";
      fetch("/shall/" + encodeURIComponent(id)).then(function (x) { if (!x.ok) throw 0; return x.json(); })
        .then(function (j) { row.shall = j.shall || []; }, function () { row.shall = [{ text: "Could not load the requirements. Open the full RFQ document instead." }]; })
        .then(render);
      return;
    }
    render();
  });
  $("head").addEventListener("click", function (e) {
    var th = e.target.closest("th"); if (!th || th.classList.contains("nosort")) return;
    var key = th.dataset.key;
    sort = sort.key === key ? { key: key, dir: -sort.dir } : { key: key, dir: key === "value" ? -1 : 1 };
    render();
  });
  ["q", "st", "level", "category", "hideFlagged"].forEach(function (id) {
    function onFilter() { render(); }
    var timer;
    $(id).addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(onFilter, 0); }); // coalesce events from one keystroke
    $(id).addEventListener("change", function () { clearTimeout(timer); onFilter(); });
  });
  // Keep the user's view across the reload that follows a refresh: filters, sort, open rows and scroll position.
  var UI_KEY = "rfqUiState", FIELDS = ["q", "st", "level", "category"];
  function loadShall(row) { // same fetch as the Show-all-requirements button, for rows that were open before the reload
    fetch("/shall/" + encodeURIComponent(row.id)).then(function (x) { if (!x.ok) throw 0; return x.json(); })
      .then(function (j) { row.shall = j.shall || []; }, function () { row.shall = [{ text: "Could not load the requirements. Open the full RFQ document instead." }]; })
      .then(render);
  }
  window.saveUiState = function () {
    try {
      var o = { at: Date.now(), sort: sort, expanded: expanded, scopeOpen: scopeOpen, scrollY: window.scrollY, hideFlagged: $("hideFlagged").checked };
      FIELDS.forEach(function (id) { o[id] = $(id).value; });
      sessionStorage.setItem(UI_KEY, JSON.stringify(o));
    } catch (e) {}
  };
  var restoredScroll = null;
  try {
    var saved = JSON.parse(sessionStorage.getItem(UI_KEY) || "null");
    sessionStorage.removeItem(UI_KEY); // used once, for the reload right after a refresh
    if (saved && Date.now() - saved.at < 10 * 60000) {
      FIELDS.forEach(function (id) { if (saved[id] != null) $(id).value = saved[id]; });
      $("hideFlagged").checked = saved.hideFlagged !== false;
      if (saved.sort && saved.sort.key) sort = saved.sort;
      Object.keys(saved.scopeOpen || {}).forEach(function (id) { scopeOpen[id] = true; });
      rows.forEach(function (r) { if (saved.expanded && saved.expanded[r.id]) { expanded[r.id] = true; if (!r.shall && shallN(r)) loadShall(r); } });
      restoredScroll = saved.scrollY;
    }
  } catch (e) {}
  render();
  if (restoredScroll) window.scrollTo(0, restoredScroll);
  // Build every row's search text now, while the page is idle, so the first keystroke is not slower than the rest.
  setTimeout(function () { rows.forEach(function (r) { if (!r._hay) r._hay = haystack(r); }); }, 0);
})();
</script>
<script>
// Refresh banner: polls the service. Shows what is happening ("Refreshing...", or the first-time fetch), what went wrong
// after a refresh (failed or not-yet-set-up sources) and reloads the page, keeping the view, when a refresh ends.
(function () {
  var bar = document.getElementById("refreshBar"), was = false, misses = 0, lastAsOf = null;
  var hasData = !!(window.RFQS && window.RFQS.length), STALE_HOURS = 36; // a daily refresh that missed one day is normal; two is not
  function hhmm(iso) { var d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  function dayhm(iso) { var d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  function show(msg, kind, notes) {
    bar.className = "refreshbar" + (kind ? " " + kind : "");
    bar.textContent = msg;
    if (notes && notes.length) {
      var ul = document.createElement("ul");
      notes.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
      bar.appendChild(ul);
    }
    bar.hidden = false;
  }
  // What the last refresh left behind. Skipped = needs a key or login that is not set up; failed = it tried and errored.
  function problems(st) {
    var failed = [], skipped = [];
    (st.sources || []).filter(function (x) { return x.schedulable; }).forEach(function (x) {
      if (x.skipped) skipped.push(x.label + " is not set up yet (" + (x.error || "missing setting") + "), so its requests are not included.");
      else if (x.error) failed.push(x.label + " failed: " + String(x.error).slice(0, 160) + (x.fetchedAt ? ". Showing older data from " + dayhm(x.fetchedAt) + "." : ". No data from it yet."));
    });
    return { failed: failed, skipped: skipped };
  }
  function poll() {
    fetch("/api/status", { cache: "no-store" }).then(function (r) { if (!r.ok) throw r.status; return r.json(); }).then(function (st) {
      misses = 0; lastAsOf = st.dataAsOf || lastAsOf;
      if (st.refreshing) {
        was = true;
        var since = st.refreshStartedAt ? " (started " + hhmm(st.refreshStartedAt) + ")" : "";
        show(hasData ? "Refreshing\u2026" + since + " Showing the previous data until it finishes."
                     : "Fetching data for the first time\u2026" + since + " This takes several minutes; the page will fill in by itself.");
        return;
      }
      if (was) { if (window.saveUiState) window.saveUiState(); location.reload(); return; }
      var pr = problems(st), notes = pr.failed.concat(pr.skipped);
      // Old data, e.g. the PC was off for days and no refresh has succeeded since. dataAsOf = the oldest source's last good fetch.
      var ageH = st.dataAsOf ? (Date.now() - Date.parse(st.dataAsOf)) / 3600000 : 0, old = ageH > STALE_HOURS;
      if (old) notes.unshift("The newest complete data is from " + dayhm(st.dataAsOf) + " (" + (ageH >= 48 ? Math.round(ageH / 24) + " days" : Math.round(ageH) + " hours") + " old). Check the dates before relying on it.");
      if (!hasData && !st.activeRecords) {
        var neverRan = !(st.sources || []).some(function (x) { return x.lastAttempt; });
        show(neverRan ? "No data yet. The first fetch starts in a moment." : "No data yet.", pr.failed.length ? "warn" : "", notes.concat(pr.failed.length ? ["The service will retry automatically."] : []));
      } else if (notes.length) {
        show(old ? "The data is out of date." : pr.failed.length ? "The last refresh had problems. Some data may be out of date." : "Some sources are not included.", old || pr.failed.length ? "warn" : "", notes);
      } else if (st.stale) {
        show("A refresh is due and will start shortly.");
      } else bar.hidden = true;
    }).catch(function (e) {
      // 404 = something answered but it is not the RFQ service (e.g. a plain file server): it will never refresh this page.
      if (e === 404) show("This page is not connected to the RFQ service, so it cannot refresh or check for new data. Open it at http://127.0.0.1:8765/ instead. The data below may be out of date.", "offline");
      else if (++misses >= 2) show("Can't reach the RFQ service (it may be restarting or stopped). Retrying every 5 seconds. The data below may be out of date." + (lastAsOf ? " It is from " + dayhm(lastAsOf) + " or earlier." : ""), "offline");
    });
  }
  poll(); setInterval(poll, 5000);
})();
</script>
