<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFQ Bid Tracker - Discover Group</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1c2430; --muted: #6b7686; --line: #e3e7ed;
    --accent: #1f4e8c; --ok: #1d7a46; --warn: #b26a00; --bad: #b3261e;
    --federal: #1f4e8c; --state: #6a3fa0; --local: #0e7c7b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 16px 24px 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); }
  .sample { background: #fff3cd; color: #7a5b00; padding: 2px 8px; border-radius: 10px; font-size: 12px; }

  .filters { display: contents; }
  .fwrap { position: relative; }
  .fbtn { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .fbtn:hover { border-color: #c4ccd8; }
  .fbtn.on { border-color: #12306b; } /* only the border changes: no label text, weight or background change */
  .fbtn .caret { font-size: 10px; margin-left: 4px; }
  .fpanel { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; width: 280px; max-width: calc(100vw - 24px); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: 0 6px 20px rgba(28, 36, 48, .15); }
  .fpanel[hidden] { display: none; }
  .fpanel.fsub { position: static; width: auto; max-width: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; box-shadow: none; padding: 8px 0 0; margin-top: 8px; }
  .fpanel.fsub .flist { max-height: 180px; }
  .fttl { font-weight: 600; margin-bottom: 6px; }
  .fnote { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
  .frow { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
  .frow .n { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .frow.all { border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 4px; font-weight: 600; }
  .flist { max-height: 260px; overflow-y: auto; }
  .ghead { display: flex; align-items: center; }
  .ghead .frow { flex: 1; font-weight: 600; }
  .gtog { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 14px; padding: 2px 8px; }
  .gsub { margin: 0 0 4px 22px; padding-left: 8px; border-left: 2px solid var(--line); }
  .gsub .frow { font-size: 13px; }
  .frange { display: flex; gap: 8px; }
  .frange label { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; color: var(--muted); font-size: 12px; }
  .frange input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; color: var(--ink); }
  .fpresets { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .fpresets button, .freset { font: inherit; font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); cursor: pointer; }
  .freset { border: 0; background: none; color: var(--accent); text-decoration: underline; padding: 0; margin-top: 6px; }
  .fchips { padding: 0 24px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .fchips[hidden] { display: none; }
  .fchip { font: inherit; font-size: 12px; padding: 2px 8px; border: 0; border-radius: 12px; background: #e8eef8; color: var(--accent); cursor: pointer; }
  .fchip:hover { background: #d8e3f4; }
  .fclear { font: inherit; font-size: 12px; border: 0; background: none; color: var(--accent); text-decoration: underline; cursor: pointer; }
  @media (max-width: 900px) { .fchips { padding: 0 12px 10px; } }
  .refresh-ctl { display: flex; gap: 10px; align-items: center; }
  .refresh-ctl button { font: inherit; padding: 6px 14px; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
  .refresh-ctl button:disabled { opacity: .55; cursor: default; }
  .refresh-ctl .seg { display: inline-flex; }
  .refresh-ctl { position: relative; }
  .refresh-ctl button { font-size: 12px; padding: 3px 10px; }
  .specific-pop { position: absolute; top: 100%; left: 0; margin-top: 4px; z-index: 20; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.12); padding: 6px 10px; min-width: 210px; max-height: 320px; overflow: auto; font-size: 13px; }
  .specific-pop[hidden] { display: none; }
  .specific-pop label { display: flex; gap: 6px; align-items: center; padding: 2px 0; cursor: pointer; }
  .sp-states { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 8px; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
  .refresh-ctl .seg { background: #e3e7ee; border-radius: 999px; padding: 3px; gap: 2px; box-shadow: inset 0 1px 2px rgba(0,0,0,.12); }
  .refresh-ctl .seg button { background: transparent; color: var(--muted); border: 0; border-radius: 999px; padding: 4px 14px; font-weight: 500; transition: background .15s, color .15s, box-shadow .15s; }
  .refresh-ctl .seg button:hover:not(.on) { color: var(--ink); background: rgba(255,255,255,.55); }
  .refresh-ctl .seg button.on { background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .refresh-hint { color: var(--muted); font-size: 12px; max-width: 280px; line-height: 1.3; }
  .req-title { font-weight: 600; font-size: 15px; }
  .req-desc { font-size: 11.5px; line-height: 1.35; color: var(--muted); margin-top: 2px; }
  .value-inline { color: #1b7a34; font-weight: 700; white-space: nowrap; margin-left: 6px; }
  .value-inline.none { font-weight: 400; }
  .agency { color: var(--muted); font-size: 12px; }
  .buyer { font-weight: 600; font-size: 13px; margin-top: 4px; }
  .lead { margin: 2px 0 6px; line-height: 1.35; }
  abbr.gloss { text-decoration: underline dotted; cursor: help; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; color: #fff; font-size: 12px; font-weight: 600; }
  .badge.Federal { background: var(--federal); } .badge.State { background: var(--state); } .badge.Local { background: var(--local); }
  .chip { display: inline-block; background: #eef1f5; border-radius: 4px; padding: 1px 6px; margin: 0 4px 4px 0; font-size: 12px; }
  .chip.flag { background: #fdecea; color: var(--bad); font-weight: 600; }
  .chip.amend { background: #fff3cd; color: #7a5b00; font-weight: 600; }
  .chip.caveat { background: #f4f5f7; color: #555; border: 1px dashed #b8bcc4; } /* data warning: grey and dashed, so it does not read as an amendment */
  .dlist { margin: 0 0 8px; padding-left: 16px; font-size: 13px; }
  .dlist li { margin-bottom: 3px; }
  .howbid { margin: 6px 0 8px; padding: 6px 8px; border-left: 3px solid var(--accent, #2a6df4); background: rgba(42,109,244,.06); font-size: 13px; }
  .howbid .dlist { margin: 3px 0 0; }
  .dlist + .dlist { margin-top: -5px; }
  .dlist li b { color: var(--muted); font-weight: 600; }
  .dlist .chip { margin: 0 4px 2px 0; }
  .dstatus { margin-bottom: 4px; }
  .days { font-weight: 600; }
  .left { font-size: 12px; margin-top: 2px; }
  .left.urgent { color: var(--bad); font-weight: 600; }
  .left.soon { color: var(--warn); font-weight: 600; }
  .left.ok { color: var(--ok); }
  .na { color: var(--muted); }
  .value-chip.none { background: #f4f5f7; color: #666; font-weight: 400; }
  .value-chip { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 4px; background: #e6f4ea; color: #1b5e20; font-size: 13px; font-weight: 700; }
  a { color: var(--accent); }
  .elig { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .elig.yes { background: #e3f4ea; color: var(--ok); }
  .elig.chip { background: #e8eefc; color: #1f3a8a; margin: 0 4px 4px 0; }
  .elig.chip.hard { background: #fdecea; color: var(--bad); }
  .elig.chip.cost { background: #fff3cd; color: #7a5b00; }
  .elig.chip.possible { background: #f4f5f7; color: #555; border: 1px dashed #b8bcc4; font-weight: 400; }
  .elig.chip.meeting { background: #e0f2f1; color: #00695c; margin-top: 4px; }
  .elig.unclear { background: #efe6f8; color: #5a2d82; } /* "Not checked": purple, distinct from every eligibility and details chip */
  .elig-note { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .val-range { font-size: clamp(10px, 0.95vw, 12px); color: var(--muted); white-space: nowrap; }
  .val-note { margin-top: 4px; font-size: 11px; line-height: 1.35; color: var(--muted); font-weight: 400; text-align: left; overflow-wrap: anywhere; }
  .val-ex { margin-top: 4px; font-size: 11px; line-height: 1.35; text-align: left; overflow-wrap: anywhere; }
  .val-ex summary { cursor: pointer; color: var(--muted); }
  .val-ex ul { margin: 4px 0 0; padding-left: 14px; }
  .elig { white-space: normal; }
  .facts { margin: 2px 0 6px; padding: 6px 8px; border-left: 3px solid var(--warn); background: #fffaf0; border-radius: 0 4px 4px 0; }
  .facts.plain { padding: 0; border-left: 0; background: none; }
  .facts-h { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 3px; }
  .fact { display: inline-block; margin: 0 4px 4px 0; padding: 1px 7px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: help; }
  .fact.hard { background: #fdecea; color: var(--bad); }
  .fact.cost { background: #fff3cd; color: #7a5b00; }
  .fact.info { background: #e8eef7; color: var(--accent); }
  .scope { color: var(--ink); font-size: 13px; margin-top: 4px; }
  .toggle { margin-top: 6px; padding: 0; border: 0; background: none; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  /* Fetch-failure banner: unmissable on purpose; hidden when every state fetched fine. */
  .failbar { margin: 0 24px 12px; padding: 10px 14px; background: #fdecea; color: var(--bad); border: 2px solid var(--bad); border-radius: 8px; }
  .failbar.warn { background: #fff3cd; color: #7a5b00; border-color: var(--warn); }
  .failbar b { font-size: 15px; }
  .failbar ul { margin: 6px 0 0; padding-left: 20px; color: var(--ink); }
  .failbar li { margin-bottom: 2px; }
  .failbar.ok { background: #e9f6ec; color: #1e6b34; border-color: #1e6b34; }
  .failbar .statelive { margin-bottom: 8px; padding: 6px 10px; border-radius: 6px; background: #e8f0fb; color: var(--accent); border: 1px solid #c5d6ee; }
  .failbar { position: relative; }
  .failbar .closex { display: none; position: absolute; top: 6px; right: 8px; border: 0; background: none; color: #1e6b34; font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px; }
  .failbar.ok .closex { display: block; }
  .failbar .othersrc { margin-bottom: 8px; }
  .failbar .othersrc summary { cursor: pointer; font-weight: 700; }
  .failbar .othersrc.ok summary { color: #1e6b34; }
  .failbar .stateok { margin-top: 10px; color: #1e6b34; }
  .failbar .stateok summary { cursor: pointer; font-weight: 600; }
  .failbar .stateok ul { color: var(--ink); }
  .failbar .stateprob summary { cursor: pointer; font-weight: 700; }
  @media (max-width: 900px) { .failbar { margin: 0 12px 12px; } }
  .refreshbar { margin: 0 24px 8px; padding: 8px 12px; border-radius: 6px; background: #e8f0fb; color: var(--accent); border: 1px solid #c5d6ee; }
  .refreshbar.warn { background: #fff4e0; color: var(--warn); border-color: #f0d9a8; }
  .refreshbar { position: relative; padding-right: 36px; }
  .refreshbar .barx { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: inherit; font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px; }
  .refreshbar ul { margin: 4px 0 0; padding-left: 20px; }
  .refreshbar.offline { background: #fdecea; color: var(--bad); border-color: #f3c4c0; }
</style>

<body>
<div class="refreshbar" id="refreshBar" role="status" hidden></div>
<div class="failbar" id="failBanner" role="alert" hidden></div>
<div id="app"></div>
<!-- Hidden service layer: the refresh controls home.js drives. -->
<div id="svc" hidden style="display:none">
<style>.is-demo #failBanner { display: none !important; }</style>
<script>if (/\.github\.io$/.test(location.hostname)) document.documentElement.classList.add("is-demo"); // hosted demo: no data-problem banner</script>
  <span class="refresh-ctl">
    <span class="seg" id="refreshMode" title="What the Refresh button fetches">
      <button type="button" data-v="all" class="on">All</button><button type="button" data-v="failed">Failed</button><button type="button" data-v="specific" id="specificBtn">Specific &#9662;</button>
    </span>

      <label class="frow"><input type="checkbox" value="sam"> Federal (SAM.gov)</label>

  </span>
</div>

<script>
// Merge whichever live feeds exist. No live feed = no requests (never made-up data).
(function () {
  var src = window.LIVE_SOURCES || [];
  if (!src.length) return;
  window.RFQS = src.reduce(function (a, s) { return a.concat(s.rfqs); }, []);
  window.RFQS_META = { source: src.map(function (s) { return s.meta.source; }).join(" + "),
    fetchedAt: src.map(function (s) { return s.meta.fetchedAt; }).sort()[0] };
})();
</script>
<script>
// Fetch health: read the per-state results that fetch-states.js records in live-states.js (meta.states) and show a banner
// for every state whose last fetch failed (red) or was partial (amber). Failed states keep showing their last notices,
// so without this the rows would look current. Also sets window.STATE_ISSUES for the state dropdown.
(function () {
  var NAMES = window.STATE_NAMES = Object.assign({ AL: "Alabama", AK: "Alaska", AZ: "Arizona", AR: "Arkansas", CA: "California", CO: "Colorado", CT: "Connecticut", DE: "Delaware", DC: "District of Columbia", FL: "Florida", GA: "Georgia", HI: "Hawaii", ID: "Idaho", IL: "Illinois", IN: "Indiana", IA: "Iowa", KS: "Kansas", KY: "Kentucky", LA: "Louisiana", ME: "Maine", MD: "Maryland", MA: "Massachusetts", MI: "Michigan", MN: "Minnesota", MS: "Mississippi", MO: "Missouri", MT: "Montana", NE: "Nebraska", NV: "Nevada", NH: "New Hampshire", NJ: "New Jersey", NM: "New Mexico", NY: "New York", NC: "North Carolina", ND: "North Dakota", OH: "Ohio", OK: "Oklahoma", OR: "Oregon", PA: "Pennsylvania", RI: "Rhode Island", SC: "South Carolina", SD: "South Dakota", TN: "Tennessee", TX: "Texas", UT: "Utah", VT: "Vermont", VA: "Virginia", WA: "Washington", WV: "West Virginia", WI: "Wisconsin", WY: "Wyoming" }, { AK: "Alaska", AR: "Arkansas", CO: "Colorado", DE: "Delaware", FL: "Florida", HI: "Hawaii", IA: "Iowa", ID: "Idaho", IN: "Indiana", KS: "Kansas", LA: "Louisiana", MO: "Missouri", MS: "Mississippi", NE: "Nebraska", NY: "New York", OK: "Oklahoma", PA: "Pennsylvania", RI: "Rhode Island", SC: "South Carolina", SD: "South Dakota", TX: "Texas", TXDOT: "Texas (TxDOT)", VT: "Vermont", WV: "West Virginia", WY: "Wyoming" });
  var src = window.LIVE_SOURCES || [], st = null, issues = {}, items = [], failed = 0;
  src.forEach(function (s) { if (s.meta && s.meta.states) st = s.meta.states; });
  var box = document.getElementById("failBanner");
  function when(iso) { return iso ? new Date(iso).toLocaleString("en-US") : null; }
  var itemCode = {}; // index in items -> state code, so the poller can mark the row being retried
  if (!st) {
    // live-states.js missing or unreadable: no state data at all
    items.push("The state feed file (live-states.js) did not load, so no state notices are shown.");
    failed++;
  } else {
    Object.keys(st).sort().forEach(function (code) {
      var r = st[code] || {}, name = NAMES[code] || code;
      if (r.ok === false) {
        failed++;
        issues[code] = "failed";
        var msg = name + " (" + code + "): FETCH FAILED - " + (r.error || "unknown error") + ". " +
          (r.fetchedAt ? "Showing older notices from the last good fetch on " + when(r.fetchedAt) + (r.count != null ? " (" + r.count + " then)" : "") + "; new notices will be missing." : "No notices have ever been fetched for this state.");
        itemCode[items.length] = code; items.push(msg);
      } else if (r.partial) {
        issues[code] = issues[code] || "partial";
        items.push(name + " (" + code + "): PARTIAL fetch - " + r.partial + ". Some notices may be missing.");
      }
    });
  }
  window.STATE_ISSUES = issues;  // States that fetched fine (shown in green under the problems), plus a live "running now" line the refresh poller fills in.
  var okItems = [];
  Object.keys(st || {}).sort().forEach(function (code) {
    var r = st[code] || {};
    if (r.ok !== false) okItems.push((NAMES[code] || code) + " (" + code + ")" + (r.count != null ? ": " + r.count + " notices" : "") + (r.fetchedAt ? ", updated " + when(r.fetchedAt) : ""));
  });
  var live = document.createElement("div"); live.id = "stateLive"; live.className = "statelive"; live.hidden = true;
  window.STATE_BANNER = { box: box, live: live, NAMES: NAMES, stateItems: items.length, stateFailed: failed };
  if (items.length) {
    var title = document.createElement("summary");
    title.textContent = failed ? "⚠ Data problem: " + failed + " state source" + (failed === 1 ? "" : "s") + " failed to update" : "⚠ Some state data is incomplete";
    var ul = document.createElement("ul");
    items.forEach(function (t, i) { var li = document.createElement("li"); li.textContent = t; if (itemCode[i]) li.dataset.state = itemCode[i]; ul.appendChild(li); });
    var pd = document.createElement("details"); pd.className = "stateprob";
    pd.appendChild(title); pd.appendChild(ul); box.appendChild(pd);
    window.STATE_BANNER.title = title; window.STATE_BANNER.baseTitle = title.textContent;
    box.classList.toggle("warn", !failed);
    document.title = "⚠ " + document.title;
  }
  box.insertBefore(live, box.firstChild);
  if (okItems.length) {
    var det = document.createElement("details"); det.className = "stateok";
    var sum = document.createElement("summary"); sum.textContent = "✓ " + okItems.length + " state source" + (okItems.length === 1 ? "" : "s") + " updated successfully";
    var ok = document.createElement("ul");
    okItems.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ok.appendChild(li); });
    det.appendChild(sum); det.appendChild(ok); box.appendChild(det);
  }
  try { window.RFQ_JUST_REFRESHED = !!sessionStorage.getItem("rfqAutoReload"); } catch (e) {} // set by the page's own reload after a refresh ends
  box.hidden = !items.length; // failures (red) and partial fetches (amber) show the banner; all-green stays hidden
  if (!items.length) box.classList.add("ok");
})();
</script>
<script>
// Refresh banner: polls the service. Shows what is happening ("Refreshing...", or the first-time fetch), what went wrong
// after a refresh (failed or not-yet-set-up sources) and reloads the page, keeping the view, when a refresh ends.
(function () {
  var bar = document.getElementById("refreshBar"), was = false, misses = 0, lastAsOf = null;
  var hasData = !!(window.RFQS && window.RFQS.length), STALE_HOURS = 36; // a daily refresh that missed one day is normal; two is not
  function hhmm(iso) { var d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  function dayhm(iso) { var d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  function show(msg, kind, notes) {
    var key = msg + "|" + (notes || []).join("|");
    if (key === dismissedKey) return; // the user closed this exact message with the x
    bar.className = "refreshbar" + (kind ? " " + kind : "");
    bar.textContent = msg;
    if (notes && notes.length) {
      var ul = document.createElement("ul");
      notes.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
      bar.appendChild(ul);
    }
    var x = document.createElement("button"); x.type = "button"; x.className = "barx"; x.title = "Dismiss"; x.setAttribute("aria-label", "Dismiss"); x.textContent = "×";
    x.addEventListener("click", function () { dismissedKey = key; bar.hidden = true; });
    bar.appendChild(x);
    bar.hidden = false;
  }
  var dismissedKey = null;
  // What the last refresh left behind. Skipped = needs a key or login that is not set up; failed = it tried and errored.
  // Plain-language reason for a raw error string. Unknown errors fall back to the raw text (minus unrelated notes).
  function why(err) {
    var e = String(err || "");
    var raw = e.split(" | ").filter(function (p) { return !/^(ANTHROPIC_API_KEY not set|SAM\.gov budget)/.test(p); }).join(" | ").replace(/\s+/g, " ").trim();
    if (/UNABLE_TO_VERIFY|CERT_|SELF_SIGNED|certificate/i.test(e)) return "its security certificate could not be verified (usually a web filter, proxy or antivirus intercepting HTTPS)";
    if (/Unexpected token '<'|<!DOCTYPE|is not valid JSON/i.test(e)) return "the site sent back a web page instead of data (a web filter or proxy block page, or the site is down)";
    if (/ENOTFOUND|EAI_AGAIN/.test(e)) return "the website's address could not be found (internet or DNS problem)";
    if (/ETIMEDOUT|timeout|timed out|aborted|killed/i.test(e)) return "it took too long to respond";
    if (/ECONNRESET|ECONNREFUSED|EPIPE|socket hang up/i.test(e)) return "the connection was refused or dropped";
    if (/\b429\b/.test(e)) return "the site is limiting requests (HTTP 429)";
    if (/\b40[13]\b/.test(e)) return "the site refused access (HTTP " + /\b(40[13])\b/.exec(e)[1] + ")";
    if (/\b5\d\d\b/.test(e)) return "the site had a server error (HTTP " + /\b(5\d\d)\b/.exec(e)[1] + ")";
    return raw ? raw.slice(0, 160) : "unknown error";
  }
  function labelOf(st, id) { var s = (st.sources || []).filter(function (x) { return x.id === id; })[0]; return s ? s.label : id; }
  // problems: what failed and why. Each failed source is one line; for the states fetch, failed states are grouped by reason.
  function problems(st) {
    var failed = [], skipped = [], ids = [];
    (st.sources || []).filter(function (x) { return x.schedulable; }).forEach(function (x) {
      var older = x.fetchedAt ? " Showing older data from " + dayhm(x.fetchedAt) + "." : " No data from it yet.";
      if (x.skipped) { skipped.push(x.label + " is not set up yet (" + (x.error || "missing setting") + "), so its requests are not included."); return; }
      var badStates = (x.states || []).filter(function (s) { return s.stale; });
      if (x.error && badStates.length) { // the states fetch: list the states, grouped by reason
        ids.push(x.id);
        var groups = {};
        badStates.forEach(function (s) { var r = why(s.error); (groups[r] = groups[r] || []).push(s.code); });
        Object.keys(groups).forEach(function (r) {
          failed.push(x.label + ": " + groups[r].length + " of " + x.states.length + " states failed (" + groups[r].join(", ") + ") because " + r + "." + older);
        });
      } else if (x.error) {
        ids.push(x.id);
        failed.push(x.label + " failed because " + why(x.error) + "." + older);
      }
    });
    return { failed: failed, skipped: skipped, ids: ids };
  }
  // What the service will do about failures: the scheduled retry (what, when, which attempt) or that it has given up for today.
  function retryNotes(st) {
    var r = st.retry, out = [];
    if (r && r.sources && r.sources.length) {
      out.push("Retrying only " + r.sources.map(function (id) { var c = r.states && r.states[id]; return c && c.length ? c.map(function (k) { return (STATE_NAMES[k] || k) + " (" + k + ")"; }).join(", ") : labelOf(st, id); }).join(", ") + " automatically at " + hhmm(r.at) + " (retry " + r.attempt + " of " + r.max + "). Opening this page or pressing Refresh retries them sooner.");
    } else if (st.gaveUp) {
      out.push("Stopped retrying " + st.gaveUp.sources.map(function (id) { return labelOf(st, id); }).join(", ") + " after " + st.gaveUp.attempts + " retries. The next automatic try is " + dayhm(st.nextDueBy) + ". Press Refresh to try now.");
    }
    return out;
  }
  // Local (NYC) and federal (SAM.gov) sources, shown in the same banner as the states: red = failed, amber = not set up,
  // green = updated. Built from /api/status on every poll, since these two have no per-state data in the page.
  var OTHERS = [{ id: "nyc", kind: "local" }, { id: "sam", kind: "federal" }];
  function renderOthers(st, sb, pgl) {
    var bad = [], okL = [], failedN = 0, skippedN = 0, running = null;
    OTHERS.forEach(function (o) {
      var x = (st.sources || []).filter(function (s) { return s.id === o.id; })[0];
      if (!x) return;
      var name = x.label + " (" + o.kind + ")", now = pgl && pgl.label === x.label;
      var older = x.fetchedAt ? " Showing older data from " + dayhm(x.fetchedAt) + "." : " No data from it yet.";
      if (now) running = name;
      if (x.skipped) { skippedN++; bad.push({ t: name + ": NOT SET UP (" + (x.error || "missing setting") + "), so its requests are not included.", now: now }); }
      else if (x.error) { failedN++; bad.push({ t: name + ": FETCH FAILED - " + why(x.error) + "." + older, now: now }); }
      else okL.push({ t: name + ": " + x.records + " open notices" + (x.fetchedAt ? ", updated " + dayhm(x.fetchedAt) : ", not fetched yet"), now: now });
    });
    var el = document.getElementById("otherSrc");
    if (!el) { el = document.createElement("details"); el.id = "otherSrc"; el.className = "othersrc"; sb.box.insertBefore(el, sb.live.nextSibling); }
    var all = bad.concat(okL);
    var head = bad.length ? "⚠ Local/federal data problem: " + bad.length + " source" + (bad.length === 1 ? "" : "s") + (failedN ? " failed to update" : " not set up")
                          : "✓ Local & federal sources updated successfully";
    if (running) head += " — ⟳ updating now: " + running;
    var sig = head + "|" + all.map(function (a) { return (a.now ? "*" : "") + a.t; }).join("|");
    if (el.dataset.sig !== sig) {
      el.dataset.sig = sig;
      var open = el.open;
      el.textContent = "";
      var sm = document.createElement("summary"); sm.textContent = head; el.appendChild(sm);
      var ul = document.createElement("ul");
      all.forEach(function (a) { var li = document.createElement("li"); li.textContent = (a.now ? "⟳ Updating now — " : "") + a.t; ul.appendChild(li); });
      el.appendChild(ul);
      el.open = bad.length ? true : open;
    }
    el.classList.toggle("ok", !bad.length);
    // Overall colour: red if anything failed, amber if only warnings, green only when everything (states too) is fine.
    var anyFail = sb.stateFailed || failedN;
    var anyWarn = anyFail || sb.stateItems > 0 || skippedN > 0; // red = failed; amber = partial state fetch or a source not set up
    sb.box.classList.toggle("ok", !anyWarn);
    sb.box.classList.toggle("warn", !!anyWarn && !anyFail);
    if (!sb.box.querySelector(".closex")) {
      var x = document.createElement("button"); x.className = "closex"; x.type = "button"; x.title = "Dismiss"; x.setAttribute("aria-label", "Dismiss"); x.textContent = "×";
      x.addEventListener("click", function () { sb.dismissed = true; sb.box.hidden = true; });
      sb.box.appendChild(x);
    }
    // A dismissed green banner stays hidden; any problem brings it back (and re-arms the dismissal for the next green one).
    if (anyWarn) { sb.dismissed = false; }
    // The all-green banner only appears during a refresh and on the page load that follows it, not on a plain startup/reload.
    sb.box.hidden = !!sb.dismissed || !anyWarn;
    var t =document.title.replace(/^⚠ /, "");
    document.title = anyWarn ? "⚠ " + t : t;
  }
  // Opening or reloading the page retries sources whose last fetch failed, once per page load. Not for the reload
  // this page does itself when a refresh ends (that would loop for as long as a source keeps failing).
  var retried = false;
  try { if (sessionStorage.getItem("rfqAutoReload")) { sessionStorage.removeItem("rfqAutoReload"); retried = true; } } catch (e) {}
  function retryFailed(st) {
    retried = true;
    if (!problems(st).failed.length) return;
    fetch("/api/refresh?failed=1", { method: "POST" }).then(function () { poll(); }, function () {});
  }
  var btn = document.getElementById("refreshBtn");
  var modeEl = document.getElementById("refreshMode");
  var modeBtns = modeEl.querySelectorAll("button");
  var modeSel = { value: "all", set disabled(d) { for (var i = 0; i < modeBtns.length; i++) modeBtns[i].disabled = d; } };
  function setMode(v) {
    modeSel.value = v;
    for (var i = 0; i < modeBtns.length; i++) modeBtns[i].classList.toggle("on", modeBtns[i].dataset.v === v);
  }
  var pop = document.getElementById("specificPop"), stBox = document.getElementById("specificStates");
  var portalSel = {
    get value() { // comma-separated ids of the ticked boxes ("" = none)
      return Array.prototype.map.call(pop.querySelectorAll("input:checked"), function (c) { return c.value; }).join(",");
    },
    set disabled(d) { var all = pop.querySelectorAll("input"); for (var i = 0; i < all.length; i++) all[i].disabled = d; }
  };
  try { var m = localStorage.getItem("rfqRefreshMode"); if (m === "all" || m === "failed") setMode(m); } catch (e) {}
  // Individual states are added from the service status (the states it knows about).
  fetch("/api/status", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (st) {
    var src = (st.sources || []).filter(function (s) { return s.id === "states"; })[0];
    ((src && src.states) || []).forEach(function (s) {
      var l = document.createElement("label"); l.innerHTML = '<input type="checkbox" value="state:' + s.code + '"> ' + s.code; stBox.appendChild(l);
    });
  }).catch(function () {});
  function specificLabel() {
    var n = pop.querySelectorAll("input:checked").length;
    document.getElementById("specificBtn").innerHTML = (n ? "Specific (" + n + ")" : "Specific") + " &#9662;";
  }
  pop.addEventListener("change", function () { setMode("specific"); specificLabel(); });
  document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target) && e.target.id !== "specificBtn") pop.hidden = true; });
  for (var bi = 0; bi < modeBtns.length; bi++) modeBtns[bi].addEventListener("click", function () {
    setMode(this.dataset.v);
    pop.hidden = this.dataset.v !== "specific" ? true : !pop.hidden;
    try { if (modeSel.value !== "specific") localStorage.setItem("rfqRefreshMode", modeSel.value); } catch (e) {}
  });
  btn.addEventListener("click", function () {
    var portal = portalSel.value;
    if (modeSel.value === "specific" && !portal) { pop.hidden = false; show("Tick at least one portal under Specific, or choose All.", ""); return; }
    pop.hidden = true;
    btn.disabled = true; btn.textContent = "Starting…";
    fetch("/api/refresh" + (modeSel.value === "failed" ? "?failed=1" : modeSel.value === "specific" ? "?portal=" + encodeURIComponent(portal) : ""), { method: "POST" }).then(function (r) {
      if (!r.ok && r.status !== 409) throw r.status; // 409 = one is already running: just show its progress
      if (r.status === 200) { btn.disabled = false; btn.textContent = "Refresh data"; show("Data is already up-to-date.", ""); return; }
      retried = true; poll();
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = "Refresh data";
      show(e === 403 || e === 401 ? "The service refused the refresh request (it only accepts it from this machine, or needs REFRESH_TOKEN)."
                                  : "Could not start a refresh. Is the RFQ service running?", "offline");
    });
  });
  function poll() {
    fetch("/api/status", { cache: "no-store" }).then(function (r) { if (!r.ok) throw r.status; return r.json(); }).then(function (st) {
      misses = 0; lastAsOf = st.dataAsOf || lastAsOf;
      btn.disabled = modeSel.disabled = portalSel.disabled = !!st.refreshing; btn.textContent = st.refreshing ? "Refreshing…" : "Refresh data";
      if (!retried && !st.refreshing) retryFailed(st);
      // Live status inside the state banner: what is running now, what finished OK and what failed so far in this run.
      var sb = window.STATE_BANNER;
      if (sb) {
        var pgl = st.refreshing ? st.refreshProgress : null;
        sb.live.hidden = true;
        // Live progress goes into the existing banner heading (no extra banner): which state is being retried, how many are done, and results so far.
        if (sb.title) {
          var tx = sb.baseTitle;
          if (pgl && pgl.total) {
            tx += pgl.current ? " — ⟳ retrying now: " + (sb.NAMES[pgl.current] || pgl.current) + " (" + pgl.current + ")" : " — ⟳ retrying…";
          }
          if (sb.title.textContent !== tx) sb.title.textContent = tx;
        }
        renderOthers(st, sb, st.refreshing ? st.refreshProgress : null);
        // Mark the failed row of the state being fetched/retried right now.
        var rows = sb.box.querySelectorAll("li[data-state]");
        for (var ri = 0; ri < rows.length; ri++) {
          var cur = pgl && pgl.current === rows[ri].dataset.state, mk = rows[ri].querySelector(".retrynow");
          if (cur && !mk) { mk = document.createElement("strong"); mk.className = "retrynow"; mk.textContent = "⟳ Retrying now — "; rows[ri].insertBefore(mk, rows[ri].firstChild); }
          else if (!cur && mk) mk.remove();
        }
      }
      if (st.refreshing) {
        was = true;
        var since = st.refreshStartedAt ? " (started " + hhmm(st.refreshStartedAt) + ")" : "";
        // The state banner shows live progress, so no separate top banner while a run is going.
        if (!hasData) show("Fetching data for the first time… This takes several minutes; the page will fill in by itself.");
        // otherwise leave the banner as it is: it only goes away when the user clicks its x
        return;
      }
      if (was) { if (window.saveUiState) window.saveUiState(); try { sessionStorage.setItem("rfqAutoReload", "1"); } catch (e) {} location.reload(); return; }
      var pr = problems(st), notes = pr.failed.concat(retryNotes(st), pr.skipped);
      // Old data, e.g. the PC was off for days and no refresh has succeeded since. dataAsOf = the oldest source's last good fetch.
      var ageH = st.dataAsOf ? (Date.now() - Date.parse(st.dataAsOf)) / 3600000 : 0, old = ageH > STALE_HOURS;
      if (old) notes.unshift("The newest complete data is from " + dayhm(st.dataAsOf) + " (" + (ageH >= 48 ? Math.round(ageH / 24) + " days" : Math.round(ageH) + " hours") + " old). Check the dates before relying on it.");
      if (!hasData && !st.activeRecords) {
        var neverRan = !(st.sources || []).some(function (x) { return x.lastAttempt; });
        show(neverRan ? "No data yet. The first fetch starts in a moment." : "No data yet.", pr.failed.length ? "warn" : "", notes);
      } else if (notes.length) {
        show(old ? "The data is out of date." : pr.failed.length ? "The last refresh had problems. Some data may be out of date." : "Some sources are not included.", old || pr.failed.length ? "warn" : "", notes);
      } else if (st.stale) {
        show("A refresh is due and will start shortly.");
      } // else: nothing to report; any banner already showing stays until the user clicks its x
    }).catch(function (e) {
      // 404 = something answered but it is not the RFQ service (e.g. a plain file server): it will never refresh this page.
      if (e === 404) show("This is a static snapshot; not connected to data feed service. Cannot refresh data.", "offline");
      else if (++misses >= 2) show("Can't reach the RFQ service (it may be restarting or stopped). Retrying every 5 seconds. The data below may be out of date." + (lastAsOf ? " It is from " + dayhm(lastAsOf) + " or earlier." : ""), "offline");
    });
  }
  poll(); setInterval(poll, 5000);
})();
</script>
