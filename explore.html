<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore this request</title>
<style>
  :root { --ink:#1f3347; --mut:#64748b; --line:#e4e4f0; --acc:#4338ca; --acc2:#312e81; --soft:#eef0ff; --green:#1b7a34; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; background:#fff; color:var(--ink); }
  a { color:var(--acc); }
  .nav { border-bottom:1px solid #e3e8ef; background:#fff; }
  .nav .in { max-width:980px; margin:0 auto; padding:0 24px; height:46px; display:flex; align-items:center; gap:10px; }
  .logo { font-weight:800; font-size:17px; letter-spacing:-.02em; color:var(--acc2); margin-right:auto; }
  .logo i { font-style:normal; color:#f59e0b; }
  .back { border:1px solid var(--acc); background:#fff; color:var(--acc); border-radius:999px; padding:5px 14px; font-weight:600; font-size:13px; text-decoration:none; }
  .back:hover { background:var(--soft); }
  main { max-width:760px; margin:0 auto; padding:28px 24px 64px; }
  h1 { margin:0; font-size:26px; font-weight:700; line-height:1.28; letter-spacing:-.02em; color:#27264f; overflow-wrap:anywhere; }
  .sub { color:var(--mut); margin-top:4px; font-size:13px; }
  .sub a { font-weight:600; }
  h2 { margin:30px 0 8px; font-size:17px; font-weight:700; color:#27264f; }
  h3 { margin:16px 0 4px; font-size:14px; font-weight:700; color:var(--acc2); }
  p { margin:0; }
  .text { white-space:pre-wrap; overflow-wrap:anywhere; font-size:15px; line-height:1.6; }
  .value { font-size:22px; font-weight:700; color:var(--green); }
  .value.none { font-size:15px; font-weight:400; color:var(--mut); }
  .items { margin:0; padding:0 0 0 20px; }
  .items li { margin:4px 0; padding-left:2px; overflow-wrap:anywhere; }
  .items li b { color:#27264f; }
  .na { color:var(--mut); }
  .small { color:var(--mut); font-size:12px; margin-top:6px; }
  .dates { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
  .dates > div { flex:1 1 150px; background:var(--soft); border-radius:8px; padding:10px 14px; }
  .dates .k { display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }
  .dates .v { display:block; font-size:18px; font-weight:700; color:#27264f; margin-top:2px; }
  .dates .v small { font-size:12px; font-weight:400; color:var(--mut); }
  .dates .v.soon { color:#b42318; }
  .btn { display:inline-block; background:var(--acc); color:#fff; border-radius:8px; padding:8px 16px; font-weight:600; text-decoration:none; }
  .btn:hover { background:var(--acc2); }
  .foot { margin-top:36px; font-size:12px; color:var(--mut); }
  html.embed .nav { display:none; }
  html.embed main { max-width:none; padding:20px 22px 48px; }
  @media (max-width:560px) { main, .nav .in { padding-left:14px; padding-right:14px; } h1 { font-size:21px; } }
</style>
</head>
<body>
<script>if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add("embed");</script>
<div class="nav"><div class="in"><span class="logo">Bid<i>.</i>Finder <span style="white-space:nowrap">&ndash; Discover Group, Inc.</span></span><a class="back" href="/" id="back">&larr; Back to bids</a></div></div>
<main>
  <div id="page">Loading&hellip;</div>
</main>
<script src="facts.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("id") || "";
  var $ = document.getElementById("page");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || "")) ? String(u) : ""; }
  function mdy(s) { s = String(s || "").slice(0, 10).split("-"); return s.length === 3 && s[0] ? s[1] + "/" + s[2] + "/" + s[0] : "Unknown"; }
  function money(n) { return "$" + Math.round(n).toLocaleString("en-US"); }
  function nice(t) {
    t = String(t || "").replace(/[\u0000-\u001f]+/g, " ").trim();
    if (t.length > 8 && t === t.toUpperCase()) t = t.toLowerCase().replace(/(^|[.:\-]\s*)([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); });
    return t;
  }
  function daysLeft(due) {
    var p = String(due || "").slice(0, 10).split("-"); if (p.length !== 3) return null;
    var n = new Date(); n = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.round((new Date(+p[0], +p[1] - 1, +p[2]) - n) / 86400000);
  }
  // Short summary: the first sentence(s) of the description, about 220 characters at most, cut at a word.
  function brief(t) {
    t = String(t || "").replace(/\s+/g, " ").trim(); if (!t) return "";
    var out = "", parts = t.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [t];
    for (var i = 0; i < parts.length; i++) { if (out && (out + parts[i]).length > 220) break; out += parts[i]; if (out.length >= 110) break; }
    out = out.trim();
    if (out.length > 240) out = out.slice(0, 237).replace(/\s+\S*$/, "") + "…";
    return out;
  }
  function fail(msg) { $.innerHTML = '<h1>Explore this request</h1><section>' + esc(msg) + "</section>"; }

  if (!id) return fail("No request was chosen. Go back to the list and click a title.");
  if (history.length > 1 && document.referrer) document.getElementById("back").onclick = function (e) { e.preventDefault(); history.back(); }; // keeps Home's filters and scroll

  fetch("/api/rfqs/" + encodeURIComponent(id)).then(function (r) {
    if (r.status === 404) throw new Error("This request is not in the data (the id may be old or mistyped).");
    if (!r.ok) throw new Error("The service answered with an error (" + r.status + ").");
    return r.json();
  }).then(function (r) {
    document.title = nice(r.title) + " - Explore this request";
    draw(r, null);
    return fetch("/shall/" + encodeURIComponent(id)).then(function (x) { return x.ok ? x.json() : null; }).then(function (j) {
      if (j && j.shall && j.shall.length) { draw(r, j.shall); }
    }).catch(function () {});
  }).catch(function (e) {
    fail(e.message && !/Failed to fetch/i.test(e.message) ? e.message : "Could not reach the service. Is it running?");
  });

  function draw(r, shallFull) {
    var shall = shallFull || r.shall || [];
    var title = nice(r.title), plain = r.plainTitle && r.plainTitle !== r.title ? r.plainTitle : "";
    var link = safeUrl(r.sourceUrl || r.url);
    var h = "<h1>" + esc(plain || title) + "</h1>";
    if (plain) h += '<div class="sub">Original title: ' + esc(title) + "</div>";
    h += '<div class="sub">' + esc([r.agency && nice(r.agency), r.region, r.level].filter(Boolean).join(" · ")) +
      (link ? ' · <a href="' + esc(link) + '" target="_blank" rel="noopener">View original RFQ &#8599;</a>' : "") + "</div>";

    // dates on top: posted, due, days left
    var dl = daysLeft(r.due), real = r.hasRealDeadline !== false && dl !== null;
    var dlTxt = !real ? "Unknown" : dl < 0 ? "Closed" : dl === 0 ? "Due today" : dl + (dl === 1 ? " day" : " days");
    h += '<div class="dates">' +
      '<div><span class="k">Date posted</span><span class="v">' + esc(mdy(r.posted)) + "</span></div>" +
      '<div><span class="k">Due date</span><span class="v">' + (real ? esc(mdy(r.due)) + (r.dueTime ? ' <small>' + esc(r.dueTime) + "</small>" : "") : "Not stated") + "</span></div>" +
      '<div><span class="k">Days left</span><span class="v' + (real && dl >= 0 && dl <= 3 ? " soon" : "") + '">' + esc(dlTxt) + "</span></div></div>";

    // Some sources (e.g. West Virginia) only give "<RFQ number> (<type>). Buyer: name, email, phone" as the text.
    var scope = String(r.scope || ""), buyerM = /\bBuyer:\s*(.*)$/i.exec(scope), desc = scope.replace(/\s*\bBuyer:.*$/i, "").trim();
    var restates = !desc || desc.length < 140 && (/^[A-Z0-9][A-Z0-9\-_.\/]*\s*\(.*\)\.?$/.test(desc) || desc.toLowerCase().indexOf(String(r.title || "").toLowerCase()) >= 0 && desc.length < String(r.title || "").length + 40);
    var contact = r.contact ? { name: r.contact.name, email: r.contact.email, phone: r.contact.phone } : {};
    if (buyerM && !(contact.name || contact.email || contact.phone)) {
      var em = /[^\s,;<>"]+@[^\s,;<>"]+/.exec(buyerM[1]), ph = /\(?\d{3}\)?[-.\s]?\d{3}[-.\s]\d{4}/.exec(buyerM[1]);
      contact = { email: em && em[0].replace(/[.,;]+$/, ""), phone: ph && ph[0], name: buyerM[1].replace(em ? em[0] : "", "").replace(ph ? ph[0] : "", "").replace(/[\s,;]+$/, "").replace(/^[\s,;]+|[\s,;]+(?=[\s,;])/g, "").trim() };
    }

    // 1. description, in full
    h += "<h2>1. Description</h2>";
    h += !restates ? '<p class="text">' + esc(desc) + "</p>" + (r.aiRead ? '<p class="small">AI-read, verify against the notice.</p>' : "")
      : '<p class="na">' + (r.aiRead ? "None stated." : "No description in the source data. See the RFQ document below.") + "</p>";

    // 2. contact information
    var cl = [];
    if (contact.name) cl.push("<li><b>Name:</b> " + esc(contact.name) + "</li>");
    if (contact.email && /^[^\s@<>"]+@[^\s@<>"]+$/.test(contact.email)) cl.push('<li><b>Email:</b> <a href="mailto:' + esc(contact.email) + '">' + esc(contact.email) + "</a></li>");
    if (contact.phone) cl.push("<li><b>Phone:</b> " + esc(contact.phone) + "</li>");
    h += "<h2>2. Contact Information</h2>" + (cl.length ? '<ul class="items">' + cl.join("") + "</ul>" : '<p class="na">None stated.</p>');

    // 3. RFQ document
    h += "<h2>3. RFQ Document</h2>" + (link ? '<p><a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener">View RFQ Document &#8599;</a></p>' : '<p class="na">No link available.</p>');

    // 4. estimated value
    var v = r.value || {};
    h += "<h2>4. Estimated Value</h2>";
    if (v.amount != null) {
      h += '<p class="value">' + esc(money(v.amount)) + "</p>";
      if (v.low != null && v.high != null) h += '<p class="small">Typical range ' + esc(money(v.low)) + " – " + esc(money(v.high)) + "</p>";
    } else h += '<p class="value none">' + (r.aiRead ? "Value not specified" : "Couldn't determine value") + "</p>";

    // facts from the notice text (same rules as the table)
    var facts = [];
    try {
      facts = window.computeFacts ? window.computeFacts({ id: r.id, title: r.title, scope: r.scope, shall: shall, aiRead: r.aiRead,
        details: { requirements: r.requirements || [], restriction: r.restriction } }) : [];
    } catch (e) {}
    function list(items) {
      return '<ul class="items">' + items.map(function (f) {
        return "<li><b>" + (f.kw ? "Possible: " : "") + esc(f.label) + "</b>" + (f.why ? " &ndash; " + esc(f.why) : "") + "</li>";
      }).join("") + "</ul>";
    }

    // 3. important details: trip-up factors, sub-headed by type
    var TYPE = {
      "Money and payment": ["Performance / payment bond", "Insurance minimums", "Prevailing / living wage", "Retainage or slow payment terms", "Liquidated damages for late work", "Fixed price, no escalation", "Permits and fees on the contractor", "Certified payroll / compliance reporting"],
      "Site, schedule and logistics": ["Mandatory site visit / pre-bid", "24/7 or after-hours", "Delivery terms (FOB / inside delivery)", "Escorted or restricted site access", "Hazardous materials handling", "Drug testing of workers"],
      "Sourcing and specification": ["Domestic-content rule (Buy America / TAA)", "Brand-name / \"or equal\" spec", "Submittals / samples for approval", "Warranty requirement"],
      "Contract terms and preferences": ["Local / in-state preference", "Past performance / references", "Multi-year / renewal term", "Owner can terminate for convenience"]
    };
    var rest = facts.filter(function (f) { return !f.gate; }), used = {}, tg = "";
    Object.keys(TYPE).forEach(function (name) {
      var items = rest.filter(function (f) { return TYPE[name].indexOf(f.label) >= 0; });
      items.forEach(function (f) { used[f.label] = 1; });
      if (items.length) tg += "<h3>" + esc(name) + "</h3>" + list(items);
    });
    var other = rest.filter(function (f) { return !used[f.label]; });
    if (other.length) tg += "<h3>Other</h3>" + list(other);
    h += "<h2>5. Important Details</h2>" +
      (tg || '<p class="na">' + (r.aiRead || r.scope ? "None found in the notice text." : "Not checked: the notice was not read.") + "</p>");

    // 4. eligibility
    var gates = facts.filter(function (f) { return f.gate; }), items = [];
    (r.requires || []).forEach(function (q) { items.push("<li><b>" + esc(q) + "</b></li>"); });
    if (r.restriction && !(r.requires || []).length) items.push("<li><b>" + esc(r.restriction) + "</b></li>");
    var gl = gates.length ? list(gates).replace(/^<ul class="items">|<\/ul>$/g, "") : "";
    h += "<h2>6. Eligibility</h2>";
    if (items.length || gl) h += '<ul class="items">' + items.join("") + gl + "</ul>";
    else if (r.requires == null) h += '<p class="na">Not checked: the notice documents were not read, so eligibility is unknown.</p>';
    else h += '<p class="na">No eligibility conditions found. Open to all, as far as the notice says.</p>';

    h += '<div class="foot">ID ' + esc(r.id) + " · first seen " + esc(mdy(r.firstSeen)) + " · last updated " + esc(mdy(r.updatedAt)) + "</div>";
    $.innerHTML = h;
  }
})();
</script>
</body>
</html>
