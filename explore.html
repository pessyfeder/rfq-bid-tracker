<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFQ Details</title>
<style>
  :root { --ink:#1f3347; --mut:#64748b; --line:#e4e4f0; --acc:#4338ca; --acc2:#312e81; --soft:#eef0ff; --green:#1b7a34; --navy:#14284b; --navy2:#0c1b36; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:#fff; color:var(--ink); }
  a { color:var(--acc); }
  .nav { border-bottom:1px solid #e3e8ef; background:#fff; }
  .nav .in { max-width:980px; margin:0 auto; padding:0 24px; height:46px; display:flex; align-items:center; gap:10px; }
  .logo { font-weight:800; font-size:17px; letter-spacing:-.02em; color:var(--acc2); margin-right:auto; }
  .logo i { font-style:normal; color:#f59e0b; }
  .back { border:1px solid var(--acc); background:#fff; color:var(--acc); border-radius:999px; padding:5px 14px; font-weight:600; font-size:13px; text-decoration:none; }
  .back:hover { background:var(--soft); }
  button.back { font-family:inherit; cursor:pointer; line-height:inherit; }
  main { max-width:760px; margin:0 auto; padding:28px 24px 64px; }
  h1 { margin:0; font-size:26px; font-weight:700; line-height:1.28; letter-spacing:-.02em; color:#27264f; overflow-wrap:anywhere; }
  .sub { color:var(--mut); margin-top:4px; font-size:13px; }
  .sub a { font-weight:600; }
  h2 { margin:26px 0 8px; font-size:16px; font-weight:700; color:#27264f; }
  h3 { margin:14px 0 4px; font-size:14px; font-weight:700; color:var(--acc2); }
  p { margin:0; }
  .text { white-space:pre-wrap; overflow-wrap:anywhere; font-size:15px; line-height:1.65; color:#3b4a5c; }
  .items { margin:0; padding:0 0 0 20px; }
  .items li { margin:4px 0; padding-left:2px; overflow-wrap:anywhere; }
  .items li b { color:#27264f; }
  .na { color:var(--mut); }
  .small { color:var(--mut); font-size:12px; margin-top:6px; }
  .head { display:flex; gap:16px; align-items:center; }
  .head .grow { flex:1; min-width:0; }
  .glance { position:relative; }
  .glance .rfqdoc { position:absolute; top:14px; right:14px; }
  .rfqdoc { flex:none; align-self:flex-start; background:var(--navy); color:#fff; border-radius:999px; padding:9px 16px; font-weight:700; font-size:14px; text-decoration:none; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .rfqdoc:hover { filter:brightness(1.15); }
  @media (max-width:560px) { .head { flex-wrap:wrap; } .rfqdoc { order:3; } }
  .tile { flex:none; width:56px; height:56px; border-radius:14px; background:var(--soft); border:1px solid #d9dcf5; display:grid; place-items:center; color:var(--navy); }
  .eyebrow { font-size:12px; font-weight:600; color:var(--mut); }
  .pills { display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px; margin-top:20px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:10px; font-weight:600; font-size:14px; border:1px solid #d9dcf5; background:var(--soft); color:var(--navy); }
  .pill.val { background:#eaf6ee; border-color:#c4e3cd; color:var(--green); }
  .pill.val.none { background:#f3f5f8; border-color:var(--line); color:var(--mut); font-weight:500; }
  .pill.soon { background:#fdecea; border-color:#f4c7c2; color:#b42318; }
  .pill.plain { background:none; border:0; padding:0; font-weight:500; color:var(--mut); }
  .where { margin-top:12px; color:var(--mut); font-size:14px; display:flex; flex-wrap:wrap; gap:4px 16px; }
  .bid { display:block; width:100%; margin-top:20px; background:var(--navy); color:#fff; border-radius:10px; padding:13px 18px; font-weight:700; font-size:16px; text-align:center; text-decoration:none; }
  .bid:hover { background:var(--navy2); }
  .bid.off { background:#c9d1dc; cursor:not-allowed; }
  .bid { border:0; cursor:pointer; font-family:inherit; }
  .chips, .links { display:flex; flex-wrap:wrap; gap:6px 8px; margin-top:6px; align-items:center; }
  .chip { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12.5px; font-weight:600; background:#fff; border:1px solid #d9dcf5; color:var(--navy); }
  .chip.gate { background:#fff7e6; border-color:#f3d9a4; color:#8a5a00; }
  .chip.due { background:#eaf6ee; border-color:#c4e3cd; color:var(--green); }
  .chip.due.soon { background:#fdecea; border-color:#f4c7c2; color:#b42318; }
  .glance { margin-top:8px; padding:2px 16px 14px; border:1px solid #d9dcf5; border-radius:12px; background:#fafbff; }
  .g-list { margin:0; padding-left:22px; } .g-sec { margin:12px 0 0; } .g-sec > b { color:#27264f; }
  .g-ul { margin:4px 0 0; padding-left:20px; list-style:disc; } .g-ul li { margin:3px 0; overflow-wrap:anywhere; }
  .g-why { color:var(--mut); font-size:13px; }
  .xl { font-weight:600; font-size:13px; background:#fff; border:1px solid #d9dcf5; border-radius:8px; padding:4px 10px; text-decoration:none; }
  .xl:hover { background:var(--soft); }
  .info { margin-top:6px; font-weight:600; color:#27264f; overflow-wrap:anywhere; }
  .go { display:inline-block; margin-top:6px; background:var(--navy); color:#fff; border-radius:8px; padding:9px 16px; font-weight:700; text-decoration:none; }
  .src { margin-top:10px; font-size:13px; text-align:center; }
  .sub { color:var(--mut); margin-top:6px; font-size:13px; }
  .reqs { margin-top:8px; }
  .rq-h { display:inline-flex; align-items:center; gap:8px; margin:14px 0 4px; padding:3px 12px 3px 8px; border-radius:999px; background:var(--c); color:var(--i); font-size:13px; font-weight:700; }
  .rq-dot { width:8px; height:8px; border-radius:50%; background:var(--i); }
  .reqs .items { margin-bottom:6px; }
  .foot { margin-top:36px; font-size:12px; color:var(--mut); }
  html.embed .nav { display:none; }
  html.embed main { max-width:none; padding:20px 22px 48px; }
  @media (max-width:560px) { main, .nav .in { padding-left:14px; padding-right:14px; } h1 { font-size:21px; } }
</style>
</head>
<body>
<script>if (window.__RFQ || /[?&]embed=1/.test(location.search)) document.documentElement.classList.add("embed");</script>
<div class="nav"><div class="in"><span class="logo">Bid<i>.</i>Finder <span style="white-space:nowrap">&ndash; Discover Group, Inc.</span></span><a class="back" href="/" id="back">&larr; Back to bids</a><button type="button" class="back" id="navsel" title="Change which categories you see">&larr; Back to selection</button></div></div>
<main>
  <div id="page">Loading&hellip;</div>
</main>
<script src="facts.js?v=20261122c"></script>
<script src="sample-data.js"></script>
<script src="shared.js?v=20261122b"></script>
<script>
(function () {
  var sel = document.getElementById("navsel");
  // Back to selection: the main page opens the category setup on a fresh visit.
  sel.onclick = function () { try { sessionStorage.removeItem("rfqStarted"); } catch (e) {} location.href = "/"; };
})();
</script>
<script>
(function () {
  var id = window.__RFQ ? String(window.__RFQ.id) : new URLSearchParams(location.search).get("id") || ""; // window.__RFQ: set by the single-file snapshot (build-artifact.js), which has no server
  var $ = document.getElementById("page");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || "")) ? String(u) : ""; }
  function mdy(s) { s = String(s || "").slice(0, 10).split("-"); return s.length === 3 && s[0] ? s[1] + "/" + s[2] + "/" + s[0] : "Unknown"; }
  function money(n) { return "$" + Math.round(n).toLocaleString("en-US"); }
  function nice(t) {
    t = String(t || "").replace(/[\u0000-\u001f]+/g, " ").trim();
    if (t.length > 8 && t === t.toUpperCase()) t = t.toLowerCase().replace(/(^|[.:\-]\s*)([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); });
    return t;
  }
  function daysLeft(due) {
    var p = String(due || "").slice(0, 10).split("-"); if (p.length !== 3) return null;
    var n = new Date(); n = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.round((new Date(+p[0], +p[1] - 1, +p[2]) - n) / 86400000);
  }
  // Short summary: the first sentence(s) of the description, about 220 characters at most, cut at a word.
  function brief(t) {
    t = String(t || "").replace(/\s+/g, " ").trim(); if (!t) return "";
    var out = "", parts = t.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [t];
    for (var i = 0; i < parts.length; i++) { if (out && (out + parts[i]).length > 220) break; out += parts[i]; if (out.length >= 110) break; }
    out = out.trim();
    if (out.length > 240) out = out.slice(0, 237).replace(/\s+\S*$/, "") + "…";
    return out;
  }
  function fail(msg) { $.innerHTML = '<h1>RFQ Details</h1><section>' + esc(msg) + "</section>"; }

  if (!id) return fail("No request was chosen. Go back to the list and click a title.");
  if (history.length > 1 && document.referrer) document.getElementById("back").onclick = function (e) { e.preventDefault(); history.back(); }; // keeps Home's filters and scroll

  // Public demo (static GitHub Pages): no service, so read the request from the sample data.
  var demo = !!window.__RFQ || /\.github\.io$/.test(location.hostname);
  var apiGet = demo ? new Promise(function (ok) {
    var hit = window.__RFQ || null;
    if (!hit) (window.LIVE_SOURCES || []).forEach(function (s) { (s.rfqs || []).forEach(function (x) { if (String(x.id) === id) hit = x; }); });
    ok(hit ? { status: 200, ok: true, json: function () { return Promise.resolve(Object.assign({ sourceUrl: hit.rfqUrl, region: hit.details && hit.details.region }, hit)); } } : { status: 404, ok: false });
  }) : fetch("/api/rfqs/" + encodeURIComponent(id));
  apiGet.then(function (r) {
    if (r.status === 404) throw new Error("This request is not in the data (the id may be old or mistyped).");
    if (!r.ok) throw new Error("The service answered with an error (" + r.status + ").");
    return r.json();
  }).then(function (r) {
    document.title = (window.listTitle ? window.listTitle(r) : nice(r.title)) + " - RFQ Details";
    draw(r, null);
    if (demo) return;
    return fetch("/shall/" + encodeURIComponent(id)).then(function (x) { return x.ok ? x.json() : null; }).then(function (j) {
      if (j && j.shall && j.shall.length) { draw(r, j.shall); }
    }).catch(function () {});
  }).catch(function (e) {
    fail(e.message && !/Failed to fetch/i.test(e.message) ? e.message : "Could not reach the service. Is it running?");
  });

  function draw(r, shallFull) {
    var shall = shallFull || r.shall || [];
    var title = nice(r.title), plain = "";
    // the same plain-language headline the list shows (shared.js listTitle)
    try { var lt = window.listTitle ? window.listTitle(r) : (r.plainTitle || ""); if (lt && lt !== title) plain = lt; } catch (e) { if (r.plainTitle && r.plainTitle !== r.title) plain = r.plainTitle; }
    var link = safeUrl(r.sourceUrl || r.url);
    var dl = daysLeft(r.due), real = r.hasRealDeadline !== false && dl !== null;
    var dlTxt = !real ? "" : dl < 0 ? "Closed" : dl === 0 ? "Due today" : dl + (dl === 1 ? " day left" : " days left");
    var v = r.value || {};
    var ICON = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
    var agency = r.agency && nice(r.agency);
    var h = '<div class="head"><div class="tile">' + ICON + '</div><div class="grow"><div class="eyebrow">' + esc(agency || "Request for quotation") + "</div><h1>" + esc(plain || title) + "</h1></div></div>";

    // key facts: due date, value, posted
    h += '<div class="pills">' +
      '<span class="pill' + (real && dl >= 0 && dl <= 3 ? " soon" : "") + '">Due ' + (real ? esc(mdy(r.due)) + (r.dueTime ? " " + esc(r.dueTime) : "") + " &middot; " + esc(dlTxt) : "date not stated") + "</span>" +
      (v.amount != null ? '<span class="pill val">' + esc(money(v.amount)) + (v.low != null && v.high != null ? " <small>(typical " + esc(money(v.low)) + " – " + esc(money(v.high)) + ")</small>" : "") + "</span>"
        : '<span class="pill val none">' + (r.aiRead ? "Value not specified" : "Value not determined") + "</span>") +
      '<span class="pill plain">Posted ' + esc(mdy(r.posted)) + "</span></div>";
    var where = [r.region, r.level].filter(Boolean);
    if (where.length) h += '<div class="where">' + where.map(function (w) { return "<span>&#128205; " + esc(w) + "</span>"; }).join("") + "</div>";

    h += "<!--GLANCE-->";

    // RFQ documents: the posting plus any attachments found
    var docs = [];
    (r.docs || []).forEach(function (d) { var u = d && safeUrl(d.url); if (u && u !== link) docs.push({ url: u, label: nice(d.name || d.type || "Attachment") }); });
    if (docs.length) h += '<h2>Attachments</h2><ul class="items">' + docs.map(function (d) { return '<li><a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.label) + "</a></li>"; }).join("") + "</ul>";

    // navy Bid Now button: goes to the posting site
    h += link ? '<a class="bid" id="bidnow" href="' + esc(link) + '" target="_blank" rel="noopener">Bid Now</a><div class="small src">Opens the posting site, where you submit your bid.</div>' : '<button type="button" class="bid off" disabled>Bid Now</button><div class="small src">No posting link is available for this request.</div>';

    // Some sources (e.g. West Virginia) only give "<RFQ number> (<type>). Buyer: name, email, phone" as the text.
    var scope = String(r.scope || ""), buyerM = /\bBuyer:\s*(.*)$/i.exec(scope), desc = scope.replace(/\s*\bBuyer:.*$/i, "").trim();
    // scope texts that only restate an ID, a category label or dates, never describe the request
    var PLACEHOLDER_SCOPE = [
      /^[\w\-.\/ ]{1,30}\s*\([^)]*(?:#|\bno\.?\s|\bid\b|reporter|solicitation)[^)]*\)\.?$/i,
      /NYS Contract Reporter CR#/i,
      /^[A-Z]{3,5}-[\w\-]+\s*\(.*\)(?:,?\s*(?:amended|revised))?\.?$/,
      /^(?:UNSPSC|PIN#?|Project ID|Project:|Event ID|Post Date|Questions due)/i,
      /^[A-Z0-9][\w\-. \/]*PIN:\s*\w+$/,
      /^Solicitation\s[\w\- ]{1,20}\.\s*Posted by\b/,
      /^[\w\-. \/]{1,40}\.\s*Open the advertisement\b/i,
      /^(?:RFI|Solicitation)?\s*issued on behalf of\b/i,
      /^[A-Za-z ]{1,45}\(\w{1,8}\)(?:\s*-\s*buyer\b.*)?$/,
      /(?:please visit|for information on this solicitation).*cuny\.edu\/cunybuilds/i,
      /^(?:Request (?:for|of) (?:Quote|Proposals?)|Invitation [Ff]or Bids?)\s+(?!for\b|to\b|of\b)[A-Z]/
    ];
    var restates = !desc || desc.length < 140 && (/^[A-Z0-9][A-Z0-9\-_.\/]*\s*\(.*\)\.?$/.test(desc) || PLACEHOLDER_SCOPE.some(function (p) { return p.test(desc); }) || desc.toLowerCase().indexOf(String(r.title || "").toLowerCase()) >= 0 && desc.length < String(r.title || "").length + 40);
    var contact = r.contact ? { name: r.contact.name, email: r.contact.email, phone: r.contact.phone, alt: r.contact.alt } : {};
    var okEmail = function (e) { return e && /^[^\s@<>"]+@[^\s@<>"]+$/.test(e); };
    var altOf = function (c) { return c && (c.name || c.email || c.phone) ? c : null; };
    if (buyerM && !(contact.name || contact.email || contact.phone)) {
      var em = /[^\s,;<>"]+@[^\s,;<>"]+/.exec(buyerM[1]), ph = /\(?\d{3}\)?[-.\s]?\d{3}[-.\s]\d{4}/.exec(buyerM[1]);
      contact = { email: em && em[0].replace(/[.,;]+$/, ""), phone: ph && ph[0], name: buyerM[1].replace(em ? em[0] : "", "").replace(ph ? ph[0] : "", "").replace(/[\s,;]+$/, "").replace(/^[\s,;]+|[\s,;]+(?=[\s,;])/g, "").trim() };
    }

    // contact information
    var cl = [];
    if (contact.name) cl.push("<li><b>Name:</b> " + esc(contact.name) + "</li>");
    if (contact.email && /^[^\s@<>"]+@[^\s@<>"]+$/.test(contact.email)) cl.push('<li><b>Email:</b> <a href="mailto:' + esc(contact.email) + '">' + esc(contact.email) + "</a></li>");
    if (contact.phone) cl.push("<li><b>Phone:</b> " + esc(contact.phone) + "</li>");
    var contactHtml = "<h2>Contact Information</h2>" + (cl.length ? '<ul class="items">' + cl.join("") + "</ul>" : '<p class="na">None stated.</p>');
    var apoc = altOf(contact.alt);
    if (apoc) {
      var al = [];
      if (apoc.name) al.push("<li><b>Name:</b> " + esc(apoc.name) + "</li>");
      if (okEmail(apoc.email)) al.push('<li><b>Email:</b> <a href="mailto:' + esc(apoc.email) + '">' + esc(apoc.email) + "</a></li>");
      if (apoc.phone) al.push("<li><b>Phone:</b> " + esc(apoc.phone) + "</li>");
      contactHtml += "<h2>Alternative Point of Contact</h2>" + '<ul class="items">' + al.join("") + "</ul>";
    }

    // facts from the notice text (same rules as the table)
    var facts = [];
    try {
      facts = window.computeFacts ? window.computeFacts({ id: r.id, title: r.title, scope: r.scope, shall: shall, aiRead: r.aiRead, terms: r.terms, docFacts: r.docFacts,
        details: { requirements: r.requirements || [], restriction: r.restriction } }) : [];
    } catch (e) {}
    function list(items) {
      return '<ul class="items">' + items.map(function (f) {
        return "<li><b>" + (f.kw ? "Possible: " : "") + esc(f.label) + "</b>" + (f.why ? " &ndash; " + esc(f.why) : "") + "</li>";
      }).join("") + "</ul>";
    }

    // 3. important details: trip-up factors, sub-headed by type
    var TYPE = {
      "Money and payment": ["Performance / payment bond", "Insurance minimums", "Prevailing / living wage", "Retainage or slow payment terms", "Liquidated damages for late work", "Fixed price, no escalation", "Permits and fees on the contractor", "Certified payroll / compliance reporting"],
      "Site, schedule and logistics": ["Mandatory site visit / pre-bid", "24/7 or after-hours", "Delivery terms (FOB / inside delivery)", "Escorted or restricted site access", "Hazardous materials handling", "Drug testing of workers"],
      "Sourcing and specification": ["Domestic-content rule (Buy America / TAA)", "Brand-name / \"or equal\" spec", "Submittals / samples for approval", "Warranty requirement"],
      "Contract terms and preferences": ["Local / in-state preference", "Past performance / references", "Multi-year / renewal term", "Owner can terminate for convenience"]
    };
    var rest = facts.filter(function (f) { return !f.gate; }), used = {}, tg = "";
    Object.keys(TYPE).forEach(function (name) {
      var items = rest.filter(function (f) { return TYPE[name].indexOf(f.label) >= 0; });
      items.forEach(function (f) { used[f.label] = 1; });
      if (items.length) tg += "<h3>" + esc(name) + "</h3>" + list(items);
    });
    var other = rest.filter(function (f) { return !used[f.label]; });
    if (other.length) tg += "<h3>Other</h3>" + list(other);

    // 4. eligibility
    var gates = facts.filter(function (f) { return f.gate; }), items = [];
    (r.requires || []).forEach(function (q) { items.push("<li><b>" + esc(q) + "</b></li>"); });

    // At a glance: what is requested, quantities, who can bid, costs and insurance, as coloured chips (no need to open the notice)
    // Requirements: the bid checklist (specs and quantities, deadlines and submission, delivery, payment, certifications and compliance),
    // from the AI-read lines (r.terms), the rule hits in the notice and its documents, and the notice's own key obligations.
    var reqHtml = "";
    (function () {
      var G = window.REQ_GROUPS || [], sec = "", total = 0, seenTxt = {};
      var terms = r.terms || {};
      function norm(t) { return String(t || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
      function item(t, why) { var k = norm(t); if (!k || seenTxt[k]) return ""; seenTxt[k] = 1; total++; return "<li>" + esc(t) + (why ? ' <span class="g-why">&ndash; ' + esc(why) + "</span>" : "") + "</li>"; }
      G.forEach(function (g) {
        var li = "";
        if (g.id === "deadline") {
          if (r.docDue && r.due && String(r.docDue).slice(0, 10) !== String(r.due).slice(0, 10)) li += item("The documents state a different due date: " + mdy(r.docDue) + ". Confirm which one applies.");
        }
        (terms[g.id] || []).forEach(function (t) { li += item(t); });
        facts.filter(function (f) { return (f.grp || (window.reqGroupOf && window.reqGroupOf(f.label))) === g.id; }).forEach(function (f) {
          var line = (f.kw ? "Possible: " : "") + f.label;
          if (f.why && norm(f.why).indexOf(norm(f.label)) < 0) { li += item(line, f.why); } else if (f.why) { li += item(f.why); } else { li += item(line); }
        });
        if (g.id === "certs") {
          (r.requires || []).forEach(function (q) { if (!/^\s*no set[- ]?aside/i.test(q)) li += item("Eligibility: " + q); });
        }
        if (li) sec += '<h3 class="rq-h" style="--c:' + g.color + ';--i:' + g.ink + '"><span class="rq-dot"></span>' + esc(g.title) + '</h3><ul class="items">' + li + "</ul>";
      });
      var other = "";
      facts.forEach(function (f) {
        var gid = f.grp || (window.reqGroupOf && window.reqGroupOf(f.label));
        if (G.some(function (g) { return g.id === gid; })) return;
        other += item((f.kw ? "Possible: " : "") + f.label, f.why && norm(f.why).indexOf(norm(f.label)) < 0 ? f.why : "");
      });
      if (other) sec += '<h3 class="rq-h" style="--c:#e2e8f0;--i:#334155"><span class="rq-dot"></span>Other terms and costs</h3><ul class="items">' + other + "</ul>";
      if (!total || !(r.requires || []).length) sec = '<h3 class="rq-h" style="--c:#e2e8f0;--i:#334155"><span class="rq-dot"></span>Eligibility</h3><ul class="items"><li>' + esc(r.requires == null ? "Eligibility not checked: the notice documents were not read." : "Open to all bidders, as far as the notice says.") + "</li></ul>" + sec;
      var ob = "";
      (shall || []).forEach(function (s) { if (s && s.text) ob += item(s.text, s.ref); });
      if (ob) sec += '<h3 class="rq-h" style="--c:#e2e8f0;--i:#334155"><span class="rq-dot"></span>Key obligations quoted from the notice</h3><ul class="items">' + ob + "</ul>";
      var note = r.aiRead ? "" : (r.docAccess === "none" || !r.scope ? '<p class="small">The notice documents were not read, so this list is limited to what the posting itself states. Open the RFQ doc to check the full specifications, line items and quantities.</p>' : "");
      reqHtml = '<div class="reqs">' + sec + '<p class="small">Always confirm against the RFQ document: every line item, specification, quantity, certification and the submission format.</p>' + note + "</div>";
    })();

    (function () {
      var MONEY = /\$\s?[\d,.]+(?:\s?(?:million|billion|thousand|[MKB])\b)?(?:\s+(?:per|each)\s+(?:occurrence|person|claim|accident|incident))?|\b\d{1,2}(?:\.\d+)?\s?%/i;
      var WITH_AMOUNT = /^(Insurance minimums|Bid bond|Performance|Bonding capacity|Liquidated)/;
      function li(t, why) { return "<li>" + esc(t) + (why ? ' <span class="g-why">&ndash; ' + esc(why) + "</span>" : "") + "</li>"; }
      function gc(f) {
        var t = (f.kw ? "Possible: " : "") + f.label;
        if (WITH_AMOUNT.test(f.label) && f.why) { var m = MONEY.exec(f.why); if (m) t += " · " + m[0].replace(/\s+/g, " ").trim(); }
        return li(t, window.explainFact ? window.explainFact(f.label) : "");
      }
      // numbered sections, each with bullet points
      function row(label, inner) { return inner ? '<li class="g-sec"><b>' + label + '</b><ul class="g-ul">' + inner + "</ul></li>" : ""; }
      var qtxt = [r.title, r.scope].concat((shall || []).map(function (s) { return s.text; })).join(" . ");
      var QTY = /\b(\d[\d,]*(?:\.\d+)?)\s+(units?|each|ea\b|items?|pieces?|licen[sc]es?|seats?|users?|vehicles?|gallons?|tons?|pounds?|lbs?\.?|boxes|cases|sets?|pairs?|hours?|months?|years?|acres?|miles?|sq\.? ?ft\.?|square feet|linear feet|lots?|doors?|windows?|devices?|computers?|laptops?|buses|trucks?|cars?|rooms?|buildings?|sites?|locations?|students?|meals?|kits?)\b/gi;
      var qs = [], seen = {}, qm;
      while ((qm = QTY.exec(qtxt)) && qs.length < 4) {
        var q = qm[1] + " " + qm[2].toLowerCase(); if (!seen[q] && +qm[1].replace(/,/g, "") > 0) { seen[q] = 1; qs.push(q); }
      }
      var req = "";
      if (!restates && desc) req += li(brief(desc));
      qs.forEach(function (q) { req += li("Quantity: " + q); });
      var who = "";
      var reg = "", REG = /regist|\bCAGE\b|\bUEI\b|vendor (?:number|id)|PASPort|SAM\.gov|\bSAM\b/i;
      (r.requires || []).forEach(function (q) { if (REG.test(q)) reg += li(q); else who += li(q); });
      if (r.restriction && !(r.requires || []).length) who += li(window.asideLabel ? window.asideLabel(r.restriction) : r.restriction);
      gates.forEach(function (f) { if (REG.test(f.label)) reg += gc(f); else who += gc(f); });
      if (!who && !reg) who = li(r.requires == null ? "Eligibility not checked: the notice documents were not read." : "Open to all bidders, as far as the notice says.");
      var costs = rest.filter(function (f) { return f.sev === "cost"; }).map(gc).join("");
      var info = rest.filter(function (f) { return f.sev !== "cost"; }).map(gc).join("");
      var details = costs + info;
      if (!details) details = li("No special costs, insurance or terms found in the notice.");
      var cb = [];
      if (contact.name) cb.push(esc(contact.name));
      if (contact.email && /^[^\s@<>"]+@[^\s@<>"]+$/.test(contact.email)) cb.push('<a href="mailto:' + esc(contact.email) + '">' + esc(contact.email) + "</a>");
      if (contact.phone) cb.push(esc(contact.phone));
      var cinfo = cb.length ? "<li>" + cb.join(" &middot; ") + "</li>" : "<li>No contact stated. Ask through the posting site.</li>";
      if (apoc) {
        var ab = [];
        if (apoc.name) ab.push(esc(apoc.name));
        if (okEmail(apoc.email)) ab.push('<a href="mailto:' + esc(apoc.email) + '">' + esc(apoc.email) + "</a>");
        if (apoc.phone) ab.push(esc(apoc.phone));
        cinfo += "<li>Alternative: " + ab.join(" &middot; ") + "</li>";
      }
      if (!req || restates) {
        // No real description in the notice: say what the record does state (what, who is buying, where, which category)
        var tt = (r.plainTitle || r.title || "").replace(/\s+/g, " ").trim(), ag = nice(r.agency || ""), rg = nice(r.region || ""), cat = nice(r.category || "");
        var fb = tt ? li(tt) : "";
        if (ag) fb += li("Buyer: " + ag + (rg && ag.toLowerCase().indexOf(rg.toLowerCase()) < 0 ? " (" + rg + ")" : ""));
        if (cat && !/^(no data|general|misc)/i.test(cat)) fb += li("Category: " + cat);
        fb += li("The notice gives no further description" + (r.docAccess === "none" ? "; its documents could not be opened." : "."));
        req = (fb || li("Not stated in the notice.")) + req;
      }
      var wh = [r.region, r.level].filter(Boolean).map(nice).join(", ");
      if (wh) req += li("Where: " + wh);
      var g = '<section class="glance">' + (link ? '<a class="rfqdoc" href="' + esc(link) + '" target="_blank" rel="noopener">View RFQ doc &#8599;</a>' : "") + '<h2>At a glance</h2><ol class="g-list">' + row("Request + Description", req) + row("Registration", reg) + ('<li class="g-sec"><b>Requirements</b>' + reqHtml + "</li>") +row("Contact Information", cinfo) + "</ol>" +
        (!r.aiRead && !r.scope ? '<p class="small">The notice text was not read, so only what the posting itself states is shown.</p>' : "") + "</section>";
      h = h.replace("<!--GLANCE-->", g);
    })();

    h += '<div class="foot">ID ' + esc(r.id) + " · first seen " + esc(mdy(r.firstSeen)) + " · last updated " + esc(mdy(r.updatedAt)) + "</div>";
    $.innerHTML = h;
  }
})();
</script>
</body>
</html>
