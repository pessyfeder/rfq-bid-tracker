<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore this request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#16232f; --mut:#5d6b7a; --line:#e6e2d9; --bg:#f4f1ea; --card:#fffdf8; --acc:#0f5c4d; --acc2:#0b4a3e; --accsoft:#e3efe9;
          --green:#17703a; --warn:#a85a07; --red:#b42318; --shadow:0 1px 2px rgba(22,35,47,.05),0 8px 24px -12px rgba(22,35,47,.18); }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  main { max-width:1120px; margin:0 auto; padding:24px 20px 72px; }
  a { color:var(--acc); }
  .back { display:inline-flex; align-items:center; gap:6px; margin-bottom:18px; font-size:13px; font-weight:600; text-decoration:none; color:var(--mut); padding:6px 12px 6px 10px; border-radius:999px; border:1px solid var(--line); background:var(--card); transition:.15s; }
  .back:hover { color:var(--ink); border-color:#cfc8b8; }
  .hero { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 30px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .hero::before { content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,var(--acc),#3a9b7f 60%,#c9a227); }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); margin-bottom:8px; }
  h1 { margin:0; font-family:"Fraunces", Georgia, serif; font-size:32px; font-weight:600; line-height:1.18; letter-spacing:-.01em; overflow-wrap:anywhere; }
  .sub { color:var(--mut); margin-top:8px; font-size:14px; }
  .sub.orig { font-style:italic; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .tag { font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--accsoft); color:var(--acc); }
  .tag.warn { background:#fbf0dc; color:var(--warn); }
  .tag.red { background:#fbe6e4; color:var(--red); }
  .banner { margin-top:14px; padding:10px 14px; border-radius:10px; background:#fbf3e3; border:1px solid #efdcb5; color:#6b4207; font-size:14px; display:flex; gap:10px; }
  .banner::before { content:"!"; flex:none; width:20px; height:20px; border-radius:50%; background:var(--warn); color:#fff; font-weight:800; font-size:12px; display:grid; place-items:center; margin-top:1px; }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:20px; margin-top:20px; align-items:start; }
  .side { position:sticky; top:20px; display:flex; flex-direction:column; gap:14px; }
  .card, section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px; box-shadow:var(--shadow); }
  section + section { margin-top:16px; }
  section h2, .card h2 { margin:0 0 12px; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 8px; }
  section h2 small { font-weight:500; letter-spacing:0; text-transform:none; font-size:12px; color:#8a95a1; }
  section.key { border-left:4px solid var(--acc); }
  .countdown { text-align:center; padding:22px; }
  .countdown .big { font-family:"Fraunces", Georgia, serif; font-size:56px; line-height:1; font-weight:600; }
  .countdown .lbl { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); margin-top:6px; }
  .countdown .when { margin-top:10px; font-size:14px; }
  .facts { display:flex; flex-direction:column; }
  .fact { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px dashed var(--line); }
  .fact:first-child { border-top:0; padding-top:0; }
  .fact .k { font-size:13px; color:var(--mut); }
  .fact .v { font-weight:600; text-align:right; }
  .fact .s { font-size:12px; color:var(--mut); font-weight:400; }
  .green { color:var(--green); } .warn { color:var(--warn); } .red { color:var(--red); }
  .none { color:var(--mut); font-weight:500; }
  .cta { display:flex; justify-content:center; align-items:center; gap:8px; background:var(--acc); color:#fff; text-decoration:none; font-weight:700; padding:13px 18px; border-radius:12px; box-shadow:0 8px 20px -10px var(--acc); transition:.15s; }
  .cta:hover { background:var(--acc2); transform:translateY(-1px); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { font-size:13px; font-weight:600; padding:5px 12px; border-radius:999px; border:1px solid; cursor:help; }
  .chip.gate { background:#fbe6e4; color:var(--red); border-color:#f1c3be; }
  .chip.cost { background:#fbf0dc; color:#8a4b05; border-color:#ecd3a3; }
  .chip.info { background:#e6eff8; color:#1d4f86; border-color:#bfd4ec; }
  .chip.possible { background:transparent; border-style:dashed; }
  .why { margin:14px 0 0; padding:0; list-style:none; font-size:14px; color:#3b4856; }
  .why li { padding:8px 0; border-top:1px solid var(--line); }
  .why li:first-child { border-top:0; }
  .scope { white-space:pre-wrap; overflow-wrap:anywhere; font-size:15px; line-height:1.7; }
  .na { color:var(--mut); font-style:italic; }
  .shall { margin:0; padding:0; list-style:none; counter-reset:s; }
  .shall li { counter-increment:s; position:relative; padding:10px 0 10px 40px; border-top:1px solid var(--line); overflow-wrap:anywhere; }
  .shall li:first-child { border-top:0; }
  .shall li::before { content:counter(s); position:absolute; left:0; top:10px; width:26px; height:26px; border-radius:8px; background:var(--accsoft); color:var(--acc); font-size:12px; font-weight:800; display:grid; place-items:center; }
  .ref { color:var(--mut); font-size:12px; }
  dl { margin:0; display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; font-size:14px; }
  dt { color:var(--mut); } dd { margin:0; overflow-wrap:anywhere; font-weight:500; }
  .foot { margin-top:24px; font-size:12px; color:var(--mut); text-align:center; }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; } .side { position:static; order:-1; } }
  @media (max-width:560px) { main { padding:16px 12px 48px; } .hero { padding:22px 18px; } h1 { font-size:25px; } dl { grid-template-columns:1fr; } dd { margin-bottom:6px; } }
</style>
</head>
<body>
<main>
  <a class="back" href="/" id="back">&larr; Back to bids</a>
  <div id="page">Loading&hellip;</div>
</main>
<script src="facts.js"></script>
<script src="chips.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("id") || "";
  var $ = document.getElementById("page");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || "")) ? String(u) : ""; }
  function mdy(s) { s = String(s || "").slice(0, 10).split("-"); return s.length === 3 && s[0] ? s[1] + "/" + s[2] + "/" + s[0] : "Unknown"; }
  function money(n) { return "$" + Math.round(n).toLocaleString("en-US"); }
  function nice(t) {
    t = String(t || "").replace(/[\u0000-\u001f]+/g, " ").trim();
    if (t.length > 8 && t === t.toUpperCase()) t = t.toLowerCase().replace(/(^|[.:\-]\s*)([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); });
    return t;
  }
  function daysLeft(due) {
    var p = String(due || "").slice(0, 10).split("-"); if (p.length !== 3) return null;
    var n = new Date(); n = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.round((new Date(+p[0], +p[1] - 1, +p[2]) - n) / 86400000);
  }
  function fail(msg) { $.innerHTML = '<h1>Explore this request</h1><section>' + esc(msg) + "</section>"; }

  if (!id) return fail("No request was chosen. Go back to the list and click a title.");
  if (history.length > 1 && document.referrer) document.getElementById("back").onclick = function (e) { e.preventDefault(); history.back(); }; // keeps Home's filters and scroll

  fetch("/api/rfqs/" + encodeURIComponent(id)).then(function (r) {
    if (r.status === 404) throw new Error("This request is not in the data (the id may be old or mistyped).");
    if (!r.ok) throw new Error("The service answered with an error (" + r.status + ").");
    return r.json();
  }).then(function (r) {
    document.title = nice(r.title) + " - Explore this request";
    draw(r, null);
    return fetch("/shall/" + encodeURIComponent(id)).then(function (x) { return x.ok ? x.json() : null; }).then(function (j) {
      if (j && j.shall && j.shall.length) { draw(r, j.shall); }
    }).catch(function () {});
  }).catch(function (e) {
    fail(e.message && !/Failed to fetch/i.test(e.message) ? e.message : "Could not reach the service. Is it running?");
  });

  function draw(r, shallFull) {
    var shall = shallFull || r.shall || [];
    var title = nice(r.title), plain = r.plainTitle && r.plainTitle !== r.title ? r.plainTitle : "";
    var dl = r.hasRealDeadline ? daysLeft(r.due) : null, closed = dl != null && dl < 0;
    var left = dl == null ? "" : dl < 0 ? "Closed" : dl === 0 ? "today" : dl === 1 ? "tomorrow" : "in " + dl + " days";
    var warnings = r.warnings || [];
    var h = "";

    // 1. header
    h += '<header class="hero"><div class="eyebrow">Request for quote</div><h1>' + esc(plain || title) + "</h1>";
    if (plain) h += '<div class="sub orig">Original title: ' + esc(title) + "</div>";
    h += '<div class="sub">' + esc([r.agency && nice(r.agency), r.region, r.level, r.category].filter(Boolean).join(" · ")) + "</div>";
    var tags = [];
    if (r.amended) tags.push('<span class="tag warn">Amended</span>');
    if (closed) tags.push('<span class="tag red">Closed</span>');
    if (r.active === false) tags.push('<span class="tag warn">No longer listed at source</span>');
    if (tags.length) h += '<div class="tags">' + tags.join("") + "</div>";
    warnings.forEach(function (w) { h += '<div class="banner">' + esc(w) + "</div>"; });
    h += "</header>";
    var side = "";

    // 2. key facts
    var v = r.value || {}, vHtml, vSub = "";
    if (v.amount != null) {
      vHtml = '<span class="green">' + esc(money(v.amount)) + "</span>";
      if (v.low != null && v.high != null) vSub = "Typical range " + money(v.low) + " – " + money(v.high);
    } else vHtml = '<span class="none">' + (r.aiRead ? "Value not specified" : "Couldn't determine value") + "</span>";
    var dlCls = dl == null ? "" : dl < 0 ? "red" : dl <= 7 ? "red" : dl <= 14 ? "warn" : "green";
    side += '<div class="card countdown"><div class="big ' + dlCls + '">' + (dl == null ? "&ndash;" : dl < 0 ? "Closed" : dl) + '</div><div class="lbl">' + (dl == null ? "No firm deadline" : dl < 0 ? "Bidding has ended" : dl === 1 ? "Day left" : "Days left") + '</div>' +
      (r.hasRealDeadline ? '<div class="when">Closes <b>' + esc(mdy(r.due)) + "</b>" + (r.dueTime ? " · " + esc(r.dueTime) : "") + "</div>" : "") + "</div>";
    side += '<div class="card"><h2>Key facts</h2><div class="facts">' +
      '<div class="fact"><div class="k">Municipality</div><div class="v">' + esc(r.level || "Unknown") + (r.category ? '<div class="s">' + esc(r.category) + "</div>" : "") + "</div></div>" +
      '<div class="fact"><div class="k">Closing</div><div class="v">' + (r.hasRealDeadline ? esc(mdy(r.due)) : '<span class="none">No firm deadline</span>') + 
        '<div class="s">' + esc([left, r.hasRealDeadline && r.dueTime].filter(Boolean).join(" · ")) + "</div></div></div>" +
      '<div class="fact"><div class="k">Published</div><div class="v">' + esc(r.posted ? mdy(r.posted) : "Unknown") + "</div></div>" +
      '<div class="fact"><div class="k">Estimated value</div><div class="v">' + vHtml + (vSub ? '<div class="s">' + esc(vSub) + "</div>" : "") + "</div></div></div></div>";

    // 9 (shown early so it is not missed). link to the notice
    var link = safeUrl(r.sourceUrl || r.url);
    if (link) side = '<a class="cta" href="' + esc(link) + '" target="_blank" rel="noopener">Open RFQ document &rarr;</a>' + side;

    // facts from the notice text (same rules as the table)
    var facts = [];
    try {
      facts = window.computeFacts ? window.computeFacts({ id: r.id, title: r.title, scope: r.scope, shall: shall, aiRead: r.aiRead,
        details: { requirements: r.requirements || [], restriction: r.restriction } }) : [];
    } catch (e) {}
    function chip(f, cls) { return '<span class="chip ' + cls + (f.kw ? " possible" : "") + '" title="' + esc(f.why || "") + '">' + (f.kw ? "Possible: " : "") + esc(f.label) + "</span>"; }
    function whyList(list) {
      var w = list.filter(function (f) { return f.why; });
      return w.length ? '<ul class="why">' + w.map(function (f) { return "<li><b>" + esc(f.label) + ":</b> " + esc(f.why) + "</li>"; }).join("") + "</ul>" : "";
    }

    // 3. can I bid
    var gates = facts.filter(function (f) { return f.gate; });
    var gateChips = [];
    (r.requires || []).forEach(function (q) { gateChips.push('<span class="chip gate">' + esc(q) + "</span>"); });
    if (r.restriction && !(r.requires || []).length) gateChips.push('<span class="chip gate">' + esc(r.restriction) + "</span>");
    gates.forEach(function (f) { gateChips.push(chip(f, "gate")); });
    h += '<div class="layout"><div class="body"><section class="key"><h2>Can I bid?</h2>';
    if (gateChips.length) h += '<div class="chips">' + gateChips.join("") + "</div>" + whyList(gates);
    else if (r.requires == null) h += '<span class="na">Not checked: the notice documents were not read, so eligibility is unknown.</span>';
    else h += '<span class="na">No eligibility conditions found. Open to all, as far as the notice says.</span>';
    h += "</section>";

    // 4. bid factors
    var rest = facts.filter(function (f) { return !f.gate; });
    if (rest.length) h += "<section><h2>Bid factors<small>cost, effort and attractiveness. Hover a chip for the source sentence.</small></h2>" +
      '<div class="chips">' + rest.map(function (f) { return chip(f, f.sev === "info" ? "info" : "cost"); }).join("") + "</div>" + whyList(rest) + "</section>";

    // 4b. details from the original table: region, restriction, amended, requirement chips
    var dets = [];
    if (r.restriction) dets.push('<span class="chip gate">Restricted: ' + esc(r.restriction) + "</span>");
    if (r.amended) dets.push('<span class="chip cost">Amended</span>');
    (r.requirements || []).forEach(function (q) { dets.push('<span class="chip info">' + esc(q) + "</span>"); });
    h += "<section><h2>Details</h2>" +
      (r.region ? '<div style="margin-bottom:' + (dets.length ? "8px" : "0") + '"><b>Region:</b> ' + esc(r.region) + "</div>" : "") +
      (dets.length ? '<div class="chips">' + dets.join("") + "</div>" : (r.region ? "" : '<span class="na">None listed</span>')) + "</section>";

    // 5. scope
    h += "<section><h2>What the work is" + (r.aiRead ? "<small>AI-read, verify</small>" : "") + "</h2>" +
      (r.scope ? '<div class="scope">' + esc(r.scope) + "</div>" : '<span class="na">' + (r.aiRead ? "None stated" : "Not checked: the source data has no description.") + "</span>") + "</section>";

    // 6. shall list
    if (shall.length) h += "<section><h2>Key requirements<small>" + shall.length + " from the notice</small></h2><ol class=\"shall\">" +
      shall.map(function (s) { return "<li>" + esc(s.text) + (s.ref ? ' <span class="ref">(' + esc(s.ref) + ")</span>" : "") + "</li>"; }).join("") + "</ol></section>";

    // 7. value detail
    if (v.amount != null && (v.note || v.basis)) side += '<div class="card">' + "<h2>How the value was estimated</h2><dl>" +
      "<dt>Basis</dt><dd>" + esc({ similar_awards: "Similar past awards", stated: "Stated in the notice" }[v.basis] || v.basis) + "</dd>" +
      (v.note ? "<dt>Detail</dt><dd>" + esc(v.note) + "</dd>" : "") + "</dl></div>";

    // 8. contact
    var c = r.contact, parts = [];
    if (c) {
      if (c.name) parts.push("<dt>Name</dt><dd>" + esc(c.name) + "</dd>");
      if (c.email && /^[^\s@<>"]+@[^\s@<>"]+$/.test(c.email)) parts.push('<dt>Email</dt><dd><a href="mailto:' + esc(c.email) + '">' + esc(c.email) + "</a></dd>");
      if (c.phone) parts.push("<dt>Phone</dt><dd>" + esc(c.phone) + "</dd>");
    }
    side += '<div class="card"><h2>Contact</h2>' + (parts.length ? "<dl>" + parts.join("") + "</dl>" : '<span class="na">None stated</span>') + "</div>";
    h += '</div><aside class="side">' + side + "</aside></div>";

    // 10. footer
    h += '<div class="foot">ID ' + esc(r.id) + " · first seen " + esc(mdy(r.firstSeen)) + " · last updated " + esc(mdy(r.updatedAt)) + "</div>";
    $.innerHTML = h;
  }
})();
</script>
</body>
</html>
